<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Prova: eras idênticas (scene.pre-props.js × scene.js atual)</title>
<style>
  html,body{margin:0;background:#0e1014;color:#e8e8ea;font:13px/1.4 system-ui,Arial,sans-serif}
  .row{display:flex;gap:10px;padding:10px;align-items:flex-start;flex-wrap:wrap}
  canvas{width:292px;height:519px;display:block;border:1px solid #333}
  .c{font-size:12px;color:#9aa0ad}
  #out{padding:0 10px 10px;white-space:pre-wrap;font:13px/1.5 Consolas,monospace}
  .ok{color:#8dffb0}.bad{color:#ff7a7a}
</style>
</head>
<body>
<div id="out">comparando…</div>
<div class="row" id="rows"></div>
<!-- Mesma era (padrão 2), mesmo instante, mesma semente de Math.random: módulo aprovado (tools/scene.pre-props.js)
     contra o módulo atual (scene.js). Compara pixel a pixel o canvas inteiro (390x692 @2x).  ?era=2&t=3,27,48 -->
<script src="tools/scene.pre-props.js"></script>
<script>window.EonOld = window.EonScene; window.EonScene = undefined;</script>
<script src="scene.js"></script>
<script>
(async function () {
  const q = new URLSearchParams(location.search), era = q.get('era') || '2', ts = (q.get('t') || '3,27,48').split(',').map(Number);
  const base = '../../assets/bg/v2/era' + era + '/', W = 390, SH = 692, DPR = 2, out = document.getElementById('out'), rows = document.getElementById('rows');
  function seed(a) { Math.random = function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const meta = await fetch(base + 'meta.json').then(r => r.json());
  async function shot(mod, t, label) {
    const cv = document.createElement('canvas'), box = document.createElement('div'); box.innerHTML = '<div class="c">' + label + ' · t=' + t + '</div>'; box.appendChild(cv); rows.appendChild(box);
    const sc = await mod.create(cv, { base: base, meta: JSON.parse(JSON.stringify(meta)), width: W, height: SH, dpr: DPR, autoStart: false }); await sc.ready;
    seed(12345); sc.set(t, true); sc.draw();
    return cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data;
  }
  const res = []; let txt = '';
  for (const t of ts) {
    const a = await shot(window.EonOld, t, 'aprovado'), b = await shot(window.EonScene, t, 'atual');
    let diff = 0, max = 0; for (let i = 0; i < a.length; i++) { const d = Math.abs(a[i] - b[i]); if (d) { diff++; if (d > max) max = d; } }
    res.push({ t: t, bytes: a.length, diff: diff, max: max });
    txt += 't=' + t + ' s: ' + (a.length / 4) + ' pixels comparados, ' + diff + ' canais diferentes (maior diferença ' + max + ')\n';
  }
  const ok = res.every(r => r.diff === 0);
  out.innerHTML = '<span class="' + (ok ? 'ok' : 'bad') + '">' + (ok ? 'IDÊNTICO' : 'DIFERENTE') + ' — era ' + era + '</span>\n' + txt;
  window.__cmp = { ok: ok, res: res };
})().catch(e => { document.getElementById('out').textContent = 'ERRO: ' + e.message; window.__cmp = { error: e.message }; });
</script>
</body>
</html>
