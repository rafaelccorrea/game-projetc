<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kaia animada</title>
<style>body{margin:0;background:#15151c;color:#eee;font:14px system-ui}h1{font-size:17px;margin:12px 16px 4px}p{margin:4px 16px;color:#aab}.g{display:flex;flex-wrap:wrap;gap:10px;padding:10px 16px}canvas{display:block;max-width:100%;border-radius:8px}</style></head><body>
<h1>Kaia (fase garota): correndo, parada e golpe, ao lado do Kael</h1>
<p>Mesmo método aprovado do Kael: corpo em vídeo com bastão-guia na mão direita, espada desenhada por código (aqui a espada rúnica). Mesma escala do Kael garoto, com os pés no chão.</p><div class="g" id="g"></div>
<script>
const A='../../../assets/';const L=s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=s;});
(async()=>{const bg=await L(A+'bg/era2.png'),gyF=(await (await fetch(A+'bg/meta.json')).json()).era2.groundY;const items=[];
 for(const [s,lab] of [['run','correndo'],['idle','parada'],['attack','golpe']]){const kaia={img:await L(A+'anim/hyb/kaia/kaia_'+s+'_era2_t1.png'),m:await (await fetch(A+'anim/hyb/kaia/kaia_'+s+'_era2_t1.json')).json()};
  const kn=s==='attack'?'kael_attack_wide_era2_t1':'kael_'+s+'_era2_t1';const kael={img:await L(A+'anim/hyb/R/'+kn+'.png'),w:s==='attack'?448:256,pl:s==='attack'?96:0,n:s==='run'?8:s==='idle'?12:17};
  const c=document.createElement('canvas');c.width=420;c.height=280;document.getElementById('g').appendChild(c);items.push({c,kaia,kael,lab,s});}
 const t0=performance.now();(function loop(n){const t=(n-t0)/1000;for(const {c,kaia,kael,lab,s} of items){const g=c.getContext('2d'),Wd=c.width,H=c.height,gy=H*0.86;g.clearRect(0,0,Wd,H);
  if(bg){const k=Math.max(H/(bg.height*(0.86/gyF)),Wd/bg.width),bw=bg.width*k,bh=bg.height*k,off=s==='run'?(t*95)%bw:0;for(let x=-off-bw;x<Wd+bw;x+=bw)g.drawImage(bg,x,gy-gyF*bh,bw,bh);}
  const i=Math.floor(t*12)%kael.n;g.drawImage(kael.img,i*kael.w,0,kael.w,256,Wd*0.3-(kael.pl+128),gy-243,kael.w,256);
  const m=kaia.m,j=Math.floor(t*m.fps)%m.frames;g.drawImage(kaia.img,j*m.w,0,m.w,m.h,Wd*0.68-(m.padLeft+128),gy-m.feetY,m.w,m.h);
  g.fillStyle='#fff';g.font='12px system-ui';g.fillText(lab+' (Kael à esquerda, Kaia à direita)',8,16);}requestAnimationFrame(loop);})(t0);})();
</script></body></html>
