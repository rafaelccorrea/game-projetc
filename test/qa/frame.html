<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QA: jogo em largura de verdade</title>
<!-- Página de teste do QA: mostra o jogo (mesma origem) dentro de um iframe com a LARGURA REAL do celular (288, 360, 390...).
     Uso: http://<origem>:8080/test/qa/frame.html?w=360&h=780&u=index.html%3Fdebug%3D1
       w, h = largura e altura do iframe em px (padrão 360 x 780)   u = caminho do jogo (padrão index.html?debug=1)
     Os botões trocam a largura sem perder o resto. Como é a mesma origem, o QA roda JS dentro do jogo com
       document.getElementById('g').contentWindow.eval('...')  (o save e o localStorage são os da origem). Só uma instância do jogo por vez. -->
<style>
html,body{margin:0;background:#0b0907;color:#e8dccb;font:14px system-ui,sans-serif}
#bar{display:flex;gap:6px;align-items:center;padding:6px;flex-wrap:wrap}
#bar button{min-height:32px;padding:0 10px;border-radius:8px;border:1px solid #6b5843;background:#2a2118;color:#e8dccb;cursor:pointer}
#bar button.on{background:#ffc94a;color:#2a1403;border-color:#ffc94a}
#wrap{display:flex;justify-content:center}
#g{border:0;background:#000;display:block}
</style>
</head>
<body>
<div id="bar"><span>Largura:</span><span id="bs"></span><span id="info"></span></div>
<div id="wrap"><iframe id="g" title="Jogo"></iframe></div>
<script>
(function(){
  var q=new URLSearchParams(location.search), w=+q.get('w')||360, h=+q.get('h')||780, u=q.get('u')||'index.html?debug=1';
  var g=document.getElementById('g'), bs=document.getElementById('bs'), info=document.getElementById('info'), SIZES=[288,320,360,390,412];
  function size(){ g.style.width=w+'px'; g.style.height=h+'px'; info.textContent=' · iframe '+w+' × '+h+' px · '+u;
    [].forEach.call(bs.children,function(b){ b.className=(+b.dataset.w===w)?'on':''; }); }
  SIZES.forEach(function(s){ var b=document.createElement('button'); b.textContent=s; b.dataset.w=s; b.onclick=function(){ w=s; size(); var p=new URLSearchParams(location.search); p.set('w',w); history.replaceState(null,'','?'+p.toString()); }; bs.appendChild(b); });
  size();
  /* caminho relativo à RAIZ do jogo (esta página fica em /test/qa/) */
  g.src=(u.charAt(0)==='/'?u:'../../'+u);
})();
</script>
</body>
</html>
