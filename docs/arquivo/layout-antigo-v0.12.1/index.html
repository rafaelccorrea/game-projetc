<html lang="pt-br">
<head>

<title>Eonbound</title>
<style>/* FONTES EMBUTIDAS (app Android): Lilita One e Nunito locais em assets/fonts, sem Google Fonts */

@font-face{font-family:'Lilita One';font-style:normal;font-weight:400;font-display:swap;src:url(assets/fonts/lilita-one-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Nunito';font-style:normal;font-weight:600 900;font-display:swap;src:url(assets/fonts/nunito-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Nunito';font-style:normal;font-weight:600 900;font-display:swap;src:url(assets/fonts/nunito-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
</style>
<style>
:root{--bg:#14110f;--panel:#1f1a16;--panel2:#2a231d;--line:#3b3129;--txt:#f1e8dc;--mut:#a89a88;--gold:#ffc94a;--gem:#6fd3ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,Segoe UI,Roboto,sans-serif;overflow:hidden;touch-action:manipulation}
#app{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto}
#hud{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);font-weight:700;font-size:15px;gap:8px}
#hud .res{display:flex;gap:12px}
#hud button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-weight:700}
#cv{width:100%;height:36dvh;display:block;background:#222}
#tabs{display:flex;background:var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
#tabs button{background:none;border:0;color:var(--mut);font-weight:700;border-bottom:3px solid transparent}
.trow{display:flex;gap:8px;align-items:stretch;margin-bottom:6px}
.tnum{width:34px;display:flex;align-items:center;justify-content:center;font-weight:800;border-radius:8px;background:var(--panel2);border:1px solid var(--line)}
.tnum.ok{background:var(--gold);color:#1a1205}
.tcell{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;display:flex;align-items:center;justify-content:space-between;gap:4px}
.tcell.prem{border-color:#7a5ad0}
.tcell.can{border-color:var(--gold);box-shadow:0 0 8px #ffc94a55}
.tcell.done{opacity:.45}
#tabs button.on{color:var(--gold);border-bottom-color:var(--gold)}
#view{flex:1;overflow-y:auto;padding:10px 12px 24px;-webkit-overflow-scrolling:touch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.btn{background:linear-gradient(#e0a52a,#b27a14);color:#1a1205;border:0;border-radius:10px;padding:10px 14px;font-weight:800;font-size:14px}
.btn.alt{background:linear-gradient(#4aa9d8,#2e7ea8);color:#06151d}
.btn.dim{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
.btn:disabled{opacity:.4}
.sm{font-size:12px;color:var(--mut)}
h3{margin:4px 0 8px;font-size:15px}
.badge{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:800;color:#111}
.ico{width:46px;height:46px;border-radius:10px;background:var(--panel2);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.bar{height:8px;background:#0006;border-radius:5px;overflow:hidden}
.bar>i{display:block;height:100%;background:#4cd964}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#000c;border:1px solid var(--line);padding:8px 14px;border-radius:10px;font-weight:700;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.pull{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pull .c{flex:1 1 30%;min-width:90px;background:var(--panel2);border:2px solid;border-radius:10px;padding:8px 4px;text-align:center;font-size:12px;font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chip{flex:none;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:20px;padding:7px 12px;font-weight:700;font-size:12px}
.chip.on{background:var(--gold);color:#1a1205;border-color:var(--gold)}
.chip.lock{opacity:.4}
#tabs{overflow-x:auto}
#tabs button{flex:1 0 auto;min-width:50px;padding:6px 2px 5px;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.15}
#tabs button .ti{font-size:17px;height:20px;display:flex;align-items:center}
#tabs button .ti img{width:20px;height:20px;object-fit:contain}
.hi{width:20px;height:20px;object-fit:contain;vertical-align:-4px}
.hb{display:flex;gap:6px}
#hud .rs{display:inline-flex;align-items:center;gap:4px}
.ico{position:relative;overflow:hidden}
.ico img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--panel2)}
.ico img.th{background:none;padding:2px}.ico img.th.weapon{transform:scale(1.3)}
.ico{background:radial-gradient(circle at 50% 40%,#4a3d30,#241d17)}
#title{position:fixed;inset:0;z-index:50;background:#14110f radial-gradient(circle at 50% 30%,#3a2a52,#14110f 70%) center/cover no-repeat;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 8vh) 20px calc(env(safe-area-inset-bottom) + 24px);transition:opacity .5s}
#title.out{opacity:0;pointer-events:none}
#title .tshade{position:absolute;inset:0;background:linear-gradient(#0000 40%,#000a);pointer-events:none}
#title>*{position:relative}
#title>.tshade{position:absolute}
.tmid{text-align:center;max-width:420px;width:100%}
#tlogo{width:min(78vw,380px);max-height:34vh;object-fit:contain;filter:drop-shadow(0 6px 14px #000a)}
.tname{font-size:clamp(34px,10vw,54px);font-weight:900;color:#ffd75e;text-shadow:0 3px 0 #7a3a0a,0 0 22px #ff9a2a88,0 6px 14px #000;letter-spacing:1px;line-height:1.05}
.ttag{margin-top:8px;color:#f6ecdf;font-size:17px;text-shadow:0 2px 6px #000;font-weight:800}
.tbot{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.play{font-size:26px;font-weight:900;letter-spacing:2px;color:#2a1403;border:0;border-radius:18px;padding:16px 64px;background:linear-gradient(#ffd75e,#e0901a);box-shadow:0 5px 0 #8a4f0c,0 0 24px #ffb84a99;animation:pulse 1.6s infinite}
.play:active{transform:translateY(3px);box-shadow:0 2px 0 #8a4f0c}
@keyframes pulse{50%{transform:scale(1.05)}}
.ver{color:#fff9;font-size:11px;text-shadow:0 1px 3px #000}
#modal{position:fixed;inset:0;background:#000b;z-index:80;align-items:center;justify-content:center;padding:20px}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;width:100%;max-width:360px}
.mbox .row{margin-top:10px}
.shopg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.shopg .card{margin:0;text-align:center;padding:8px}
.shopg .ico{margin:0 auto 6px;width:56px;height:56px}
.shopg .btn{width:100%;padding:8px 4px;font-size:13px}
.soon{border-style:dashed;text-align:center;color:var(--mut)}
.dbg{position:fixed;left:6px;bottom:6px;z-index:70;background:#000a;color:#9f9;font:11px monospace;padding:4px 6px;border-radius:6px;pointer-events:none}
.chips,#tabs{scrollbar-width:none}.chips::-webkit-scrollbar,#tabs::-webkit-scrollbar{display:none}
.card>.row>.ico{width:58px;height:58px}
.ti{position:relative}.ti small{position:absolute;top:-2px;right:-9px;font-size:8px}

/* ===== V3 mobile-first ===== */
*{-webkit-touch-callout:none}
html,body{overscroll-behavior:none;position:fixed;inset:0;width:100%}
body{font-size:15px}
img{-webkit-user-drag:none}
#app{height:100dvh;max-width:480px;position:relative;overflow:hidden;background:var(--bg);box-shadow:0 0 40px #000}
#hud{padding:calc(env(safe-area-inset-top) + 6px) calc(env(safe-area-inset-right) + 12px) 6px calc(env(safe-area-inset-left) + 12px);font-size:15px;flex:none}
#hud button{min-width:44px;min-height:40px;font-size:14px}
#stage{position:relative;height:45dvh;flex:none;background:#222;overflow:hidden}
body.sheet #stage{height:30dvh}
#cv{width:100%;height:100%}
#view{border-top:1px solid var(--line);border-radius:16px 16px 0 0;margin-top:-12px;background:var(--bg);position:relative;z-index:2;padding:14px 12px 20px;box-shadow:0 -6px 16px #0008;overflow-x:hidden}
#view.up{animation:sheetup .28s cubic-bezier(.2,.9,.3,1)}
#view::before{content:"";display:block;width:44px;height:4px;border-radius:3px;background:var(--line);margin:-6px auto 8px}
@keyframes sheetup{from{transform:translateY(40%);opacity:.3}to{transform:none;opacity:1}}
#tabs{flex:none;overflow:hidden;border-bottom:0;padding:0 calc(env(safe-area-inset-right) + 2px) env(safe-area-inset-bottom) calc(env(safe-area-inset-left) + 2px);z-index:3}
#tabs button{flex:1 1 0;min-width:0;min-height:56px;padding:7px 0 6px;font-size:11px;border-bottom:0;border-top:3px solid transparent;gap:2px}
#tabs button.on{border-top-color:var(--gold);border-bottom-color:transparent;background:linear-gradient(#ffc94a22,#0000)}
#tabs button .ti{font-size:23px;height:26px}
#tabs button .ti img{width:26px;height:26px}
.sm{font-size:13px}.badge{font-size:12px}.tcell{font-size:13px}.chip{font-size:13px;min-height:40px}.pull .c{font-size:13px}
.btn{min-height:46px;font-size:15px}
.shopg .btn{font-size:14px}.shopg b{font-size:13px!important}
.chips{flex-wrap:wrap;overflow:visible}
h3{font-size:16px}
#skills{position:absolute;left:8px;right:8px;bottom:18px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;z-index:1}
#skills>*{pointer-events:auto}
#skauto{min-height:44px;min-width:64px;border-radius:22px;border:2px solid #fff6;background:#000a;color:#ddd;font-weight:800;font-size:12px;padding:0 12px}
#skauto.on{border-color:#ffe27a;color:#2a1403;background:linear-gradient(#ffd75e,#e0901a)}
.skr{display:flex;gap:12px;align-items:flex-end}
.skb{--p:0;width:62px;height:62px;border-radius:50%;border:3px solid #fffb;background:radial-gradient(circle at 40% 35%,#6a5aa8,#1d1533);position:relative;padding:0;box-shadow:0 3px 8px #000a;flex:none;color:#fff;transition:transform .08s}
.skb:active{transform:scale(.92)}
.skb.s1{width:44px;height:44px;border-width:2px;opacity:.9}
.skb.s1.hit{transform:scale(.88)}
.skb.ult{width:68px;height:68px;background:radial-gradient(circle at 40% 35%,#c8962a,#3a2206)}
.skb .skf{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:26px}
.skb img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;pointer-events:none}
.skb .skc{position:absolute;inset:0;border-radius:50%;background:conic-gradient(#000c calc(var(--p)*1%),#0000 0)}
.skb .skt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;text-shadow:0 0 4px #000,0 1px 2px #000}
.skb .skn{position:absolute;left:50%;bottom:calc(100% + 3px);transform:translateX(-50%);white-space:nowrap;font-size:11px;font-weight:800;text-shadow:0 1px 3px #000,0 0 4px #000;opacity:.95}
.skb.ult .skn{left:auto;right:-4px;transform:none;bottom:calc(100% + 16px)}
.skb.cd img{filter:saturate(.4) brightness(.7)}
.skb.rdy{border-color:#ffe27a;animation:ultp .9s infinite}
@keyframes ultp{0%,100%{box-shadow:0 0 0 0 #ffd75ecc,0 0 14px #ffb21e;transform:scale(1)}50%{box-shadow:0 0 0 9px #ffd75e00,0 0 26px #ffd75e;transform:scale(1.08)}}
.skb.no{animation:skno .25s}
@keyframes skno{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
body.sheet .skb{width:50px;height:50px}body.sheet .skb.ult{width:54px;height:54px}body.sheet .skb.s1{width:38px;height:38px}body.sheet #skills{bottom:14px}body.sheet .skb .skn{display:none}
.card.pv{display:flex;gap:10px;align-items:center;position:sticky;top:-14px;z-index:3;box-shadow:0 6px 12px #000a}
#pvc{width:150px;height:150px;flex:none;border-radius:10px;background:radial-gradient(circle at 50% 60%,#4a3d30,#1a1410)}
.pvt{flex:1;min-width:0}
.card.sel{box-shadow:0 0 0 2px var(--gold)}
#toast{top:calc(env(safe-area-inset-top) + 58px);font-size:14px}
.mbox{font-size:15px}
#tut{position:fixed;inset:0;z-index:60;pointer-events:none;display:none}
#tut .tring{position:absolute;border:3px solid var(--gold);border-radius:14px;box-shadow:0 0 0 200vmax #000a,0 0 18px var(--gold);animation:tutp 1s infinite}
@keyframes tutp{50%{border-color:#fff}}
#tut .tbub{position:absolute;left:50%;transform:translateX(-50%);width:min(340px,calc(100vw - 32px));background:var(--panel);border:2px solid var(--gold);border-radius:14px;padding:12px 14px;font-size:15px;font-weight:600;pointer-events:auto;box-shadow:0 6px 20px #000}
#tut .tbub .row{margin-top:10px;justify-content:flex-end}
#tut .tbub small{color:var(--mut);font-weight:700}

/* ===== V4: tela inteira de celular, sem rolagem (canvas atrás, HUD/abas/painel sobrepostos) ===== */
html,body{background:#0a0807}
#app{position:fixed;inset:0;width:100dvw;height:100dvh;max-width:none;margin:0;display:block;overflow:hidden;box-shadow:none;--navh:calc(58px + env(safe-area-inset-bottom))}
@media (min-width:600px) and (min-height:500px){
  #app{inset:auto;left:50%;top:20px;transform:translateX(-50%);height:calc(100dvh - 40px);width:min(430px,calc((100dvh - 40px) * 0.48));border-radius:28px;box-shadow:0 0 0 3px #2a231d,0 20px 60px #000}
}
#stage{position:absolute;inset:0;height:auto;background:#14110f}
body.sheet #stage{height:auto}
#cv{position:absolute;inset:0;width:100%;height:100%}
#hud{position:absolute;left:0;right:0;top:0;z-index:4;background:linear-gradient(#000c,#0007 70%,#0000);border-bottom:0;flex-wrap:wrap;padding-bottom:10px;text-shadow:0 1px 3px #000}
#hud button{background:#000a}
#wv{flex:1 0 100%;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:#f1e8dcdd}
#wv .bar{flex:1;height:6px}
#tabs{position:absolute;left:0;right:0;bottom:0;z-index:5;background:#17130fee;border-top:1px solid var(--line);height:var(--navh)}
#view{position:absolute;left:0;right:0;top:40%;bottom:var(--navh);margin:0;z-index:3;overflow:hidden;display:none;padding:14px 10px 6px;border-radius:16px 16px 0 0;background:#17130ff5}
body.sheet #view{display:block}
#view::before{margin:-8px auto 8px}
#skills{left:8px;right:8px;bottom:calc(var(--navh) + 12px);top:auto;z-index:2}
body.sheet #skills{bottom:auto;top:calc(env(safe-area-inset-top) + 78px);align-items:flex-start}
body.sheet .skb,body.sheet .skb.ult{width:46px;height:46px}body.sheet .skb.s1{display:none}
body.sheet #skauto{min-height:40px;font-size:11px;min-width:0}
.skb.ult{width:72px;height:72px}.skb{width:60px;height:60px}
#toast,#title,#modal,#tut{position:absolute}
#toast{top:calc(env(safe-area-inset-top) + 84px);max-width:90%}
.card{padding:8px 10px;margin-bottom:8px}
.card.cmp{display:flex;align-items:center;gap:8px}
.row.tight{gap:6px;margin-bottom:8px}
.line{margin:0 2px 8px;min-height:18px}
.btn.sml{min-height:44px;padding:6px 10px;font-size:14px;white-space:nowrap}
.row.tight .btn.sml{flex:1;padding:6px 4px}
.ok{color:#4cd964}.mut{color:var(--mut)}
.tb{position:relative;display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;flex:none;border:2px solid var(--line);border-radius:10px;background:radial-gradient(circle at 50% 40%,#4a3d30,#241d17);overflow:hidden;font-size:22px;padding:0;color:#fff}
.tb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:2px}.tb img.weapon{transform:scale(1.3)}
.tb i{position:absolute;left:0;right:0;bottom:0;font:800 10px system-ui;background:#000b;text-align:center;font-style:normal;padding:1px 0}
.tb.big{width:100%;max-width:var(--tb,84px);justify-self:center;height:auto;aspect-ratio:1}
.pvrow.small .pvu{min-height:44px;margin:0}.pvrow.small .sm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow{min-height:58px}.tb.sel{box-shadow:0 0 0 2px var(--gold)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.gc{display:flex;gap:8px;align-items:center;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:6px;height:68px;color:var(--txt);min-width:0;font:inherit}
.gc.eq{background:#2c2618}
.gt{display:flex;flex-direction:column;min-width:0;flex:1}.gt b,.gt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.grid2s{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sc{display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:6px 4px;text-align:center;min-width:0}
.sc b{font-size:13px;line-height:1.15;height:30px;overflow:hidden;display:flex;align-items:center}
.sc .btn{width:100%;padding:4px 2px}
.pager{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 8px;font-size:14px}
.pgb{width:48px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:22px;font-weight:800}
.pgb:disabled{opacity:.3}
.pvrow{display:flex;gap:10px;align-items:center;margin-bottom:2px}
#pvc{width:124px;height:124px}
.pvu{min-height:46px;display:flex;align-items:center;margin:2px 0 4px}
.mrow{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 10px;margin-bottom:6px}
.mrow .bar{height:5px;margin-top:3px}.mrow b{font-size:14px}
.trow{margin-bottom:4px}.trow .tcell{min-height:38px}.trow.thead .tcell{min-height:0;border:0;background:none;justify-content:center}.trow.thead .tnum{background:none;border:0}
#tut{z-index:90}
#tut .tbub{width:min(330px,calc(100% - 24px))}
#tut .tring{box-shadow:0 0 0 2000px #000a,0 0 18px var(--gold)}

/* ===== cenário vivo (EonScene) atrás do canvas da batalha ===== */
.scn{position:absolute;left:0;top:0;display:none;will-change:transform;pointer-events:none}
#cv{background:transparent}
/* ===== botões pelo protótipo da Batalha: nunca sobre personagem nem barra de vida =====
   coluna direita no topo do campo (velocidade, música) · coluna esquerda no topo (baú, missões) · habilidades no canto inferior direito, abaixo da linha dos pés */
#colR,#colL{position:absolute;top:calc(env(safe-area-inset-top) + 110px);display:flex;flex-direction:column;gap:8px;z-index:2}

#colR #skauto{min-width:0;width:auto;padding:0 8px;font-size:11px}
#colR #skauto.on{border-color:#ffe27a;color:#2a1403;background:linear-gradient(#ffd75e,#e0901a)}
#musb.off{opacity:.55}
#lvb{display:inline-flex;flex-direction:column;align-items:stretch;justify-content:center;min-width:54px;padding:3px 7px 4px;border-radius:10px;background:#000a;border:1px solid #6fe3ff66;font-size:12px;line-height:1.1}
#lvb b{color:#bff2ff;white-space:nowrap}
#lvb .lvbar{display:block;height:4px;margin-top:3px;border-radius:3px;background:#0009;overflow:hidden}
#lvx{display:block;height:100%;width:0;background:linear-gradient(90deg,#3fb6e0,#9af0ff);transition:width .3s}
#hud .res{gap:8px}
#chestbox .sys-chest-btn{width:52px;height:52px}#chestbox .sys-chest-btn img,#chestbox .sys-chest-emo{inset:7px;width:38px;height:38px;line-height:38px;font-size:24px}
#skills{justify-content:flex-end}
/* com painel aberto (Equip., Loja, Skins...): o campo fica com 40% da tela; as colunas somem e as habilidades vão para a faixa entre a linha dos pés e o painel */
body.sheet #colR,body.sheet #colL{display:none}
body.sheet #skills{top:auto;bottom:calc(60% + 2px);align-items:flex-end}
body.sheet .skb,body.sheet .skb.ult{width:32px;height:32px;border-width:2px}body.sheet .skb .skt{font-size:12px}body.sheet .skr{gap:8px}
#loading canvas.lscn{inset:auto;left:0;top:0;animation:none}
/* ===== tela de carregamento (protótipo 00): .lwrap tem as medidas do protótipo (844 px de altura) e é escalada por --s ===== */
#loading .lwrap{position:absolute;left:0;top:0;width:calc(100%/var(--s));height:844px;transform:scale(var(--s));transform-origin:0 0}
#loading{--s:1;position:absolute;inset:0;z-index:95;overflow:hidden;background:#16110d;font-family:Nunito,system-ui,sans-serif;color:#f6ecdf;transition:opacity .45s;outline:0}
#loading.out{opacity:0;pointer-events:none}
#loading .lbg{position:absolute;inset:0;opacity:0;--pw:1641;--py:-189;background-size:auto 1100px;background-repeat:repeat-x;background-position-y:calc(var(--py)*1px);filter:brightness(.62) saturate(1.1);animation:lpanx 6.8s linear infinite;transition:opacity .7s ease}
@keyframes lpanx{from{background-position-x:0}to{background-position-x:calc(var(--pw)*-1px)}}
#loading .lshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,7,5,.7) 0%,rgba(10,7,5,.2) 45%,rgba(10,7,5,.95) 100%)}
#loading .lpillw{position:absolute;top:300px;left:0;right:0;display:flex;justify-content:center;z-index:2}
#lpill{padding:8px 16px;border-radius:999px;background:rgba(22,17,13,.82);border:2px solid #ffc94a;font-family:'Lilita One',Nunito,system-ui,sans-serif;font-size:18px;color:#ffc94a;white-space:nowrap}
.erapill{animation:lpin .5s both}
@keyframes lpin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
#loading .llogo{position:absolute;top:120px;left:0;right:0;display:flex;justify-content:center}
#loading .llogo img{width:260px;height:160px;object-fit:contain;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6));animation:lfloat 3.6s ease-in-out infinite}
@keyframes lfloat{50%{transform:translateY(-6px)}}
#loading .lsh{position:absolute;left:50%;top:650px;width:160px;height:16px;margin-left:-80px;border-radius:50%;background:rgba(0,0,0,.45)}
#lrun{position:absolute;left:50%;top:507px;width:160px;height:160px;margin-left:-80px;background-size:1280px 160px;background-repeat:no-repeat;animation:lrunc .667s steps(8) infinite;opacity:0;transition:opacity .2s}
#lrun.ok{opacity:1;background-image:url(assets/anim/hyb/kael_run_body.png)}
@keyframes lrunc{from{background-position:0 0}to{background-position:-1280px 0}}
#loading .lbarbox{position:absolute;left:24px;right:24px;bottom:120px;display:flex;flex-direction:column;gap:8px}
#lbarw{height:18px;border-radius:10px;background:rgba(0,0,0,.6);border:2px solid #4a3a2b;padding:2px;box-sizing:border-box}
#lbar{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,#f2a826,#ffe07a);box-shadow:0 0 12px rgba(255,201,74,.8);transition:width .25s linear}
#loading .lrow{display:flex;justify-content:space-between;font-size:13px;font-weight:800;color:#e8dccb}
#loading .lfoot{position:absolute;left:24px;right:24px;bottom:36px;min-height:70px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:10px}
#ltip{margin:0;padding:10px 14px;border-radius:14px;background:rgba(29,22,17,.85);border:1px solid #4a3a2b;font-size:14px;font-weight:700;text-align:center;line-height:1.35}
#ltip b{color:#ffc94a}
.tip{animation:ltipin .5s both}
@keyframes ltipin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#lgo{display:none;align-items:center;justify-content:center;width:100%;height:56px;font-family:'Lilita One',Nunito,system-ui,sans-serif;font-size:24px;color:#ffc94a;text-shadow:0 2px 0 #000;background:none;border:0;animation:lblink 1.1s ease-in-out infinite}
@keyframes lblink{50%{opacity:.35}}
#loading.done #ltip{display:none}
#loading.done #lgo{display:flex}
#loading.done{cursor:pointer}
#lver{position:absolute;left:0;right:0;bottom:10px;margin:0;text-align:center;font-size:11px;font-weight:700;color:#b9a993}

/* ===== V5 (rodada 7): GEOMETRIA DO PROTÓTIPO. Tela 390x844: topo (HUD) 0..64 · CAMPO 64..768 (704) · abas 768..844. O #stage É o campo. ===== */
#app{--navh:calc(76px + env(safe-area-inset-bottom));--hudh:calc(64px + env(safe-area-inset-top))}
#stage{position:absolute;left:0;right:0;top:var(--hudh);bottom:var(--navh);height:auto}
body.sheet #stage{height:auto}
#hud{position:absolute;left:0;right:0;top:0;height:var(--hudh);z-index:6;display:flex;flex-wrap:nowrap;align-items:center;justify-content:flex-start;gap:8px;padding:env(safe-area-inset-top) 12px 0;background:#1d1611;border-bottom:2px solid #4a3a2b;box-sizing:border-box;font-family:Nunito,system-ui,sans-serif;font-weight:800;color:#f6ecdf;text-shadow:none;font-size:14px}
#hud button{min-width:0;min-height:0;padding:0;font-family:inherit}
#lvb{position:relative;display:block;width:44px;height:44px;min-width:0;flex:none;padding:0;border-radius:12px;border:2px solid #ffc94a;background:#33271d;overflow:hidden;box-sizing:border-box}
.kidle{background-image:url(assets/anim/hyb/R/kael_idle_era2_t0.png);background-size:1200% 100%;background-repeat:no-repeat;animation:kidl 1s steps(12,jump-none) infinite}
.kidle.t1{background-image:url(assets/anim/hyb/R/kael_idle_era2_t1.png)}.kidle.t2{background-image:url(assets/anim/hyb/R/kael_idle_era2_t2.png)}
@keyframes kidl{from{background-position:0 0}to{background-position:100% 0}}
#hav{position:absolute;left:-20px;top:-8px;width:80px;height:80px}
#lvb .hxp{position:absolute;left:0;right:0;bottom:0;height:7px;background:rgba(0,0,0,.75)}
#lvx{display:block;height:100%;width:0;background:linear-gradient(90deg,#2fc9a8,#8ff5dc);transition:width .45s ease-out;animation:xpp 2s ease-in-out infinite}
@keyframes xpp{0%,100%{filter:none}50%{filter:brightness(1.35)}}
#hud .hnm{display:flex;flex-direction:column;min-width:0;flex:1}
#hud .hn1{font-family:'Lilita One',Nunito,sans-serif;font-weight:400;font-size:16px;line-height:1.1;white-space:nowrap}
#lvt{font-family:Nunito,sans-serif;font-size:12px;font-weight:800;color:#ffc94a}
#fcv{font-size:12px;font-weight:800;color:#c9b9a2;white-space:nowrap}
#hud .hpill{display:flex;align-items:center;gap:4px;height:32px;padding:0 4px 0 2px;border-radius:999px;background:#0e0a07;border:1px solid #4a3a2b;flex:none}
#hud .hpill img{object-fit:contain}
#hud .hpill b{font-size:14px;font-weight:900;padding-right:6px}
#hud .hpill.g{padding:0 2px}#hud .hpill.g b{padding-right:0}
#gemplus{width:26px;height:26px;border-radius:50%;border:0;background:#5fd068;color:#0d2410;font-weight:900;font-size:18px;line-height:1}
#hud #cfgb{width:44px;height:44px;flex:none;border-radius:12px;border:2px solid #4a3a2b;background:#33271d;color:#f6ecdf;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
#ftop{position:absolute;top:10px;left:12px;right:12px;display:flex;flex-direction:column;gap:6px;z-index:2;pointer-events:none;font-family:Nunito,system-ui,sans-serif;color:#fff}
#ftop .ft1{display:flex;flex-direction:column}
#ftop .ftr{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
#bossb{pointer-events:auto;height:44px;padding:0 12px 0 8px;border-radius:14px;border:2px solid #7a1f17;background:linear-gradient(180deg,#ff6a50,#c0301f);color:#fff;font:400 16px 'Lilita One',Nunito,sans-serif;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 #5a140d;box-sizing:border-box;flex:none}
#skauto{display:none!important}   /* só automático: a chave saiu */
#bossb.glow{animation:bossglow 1.2s ease-in-out infinite}
#bossb.dimb{background:linear-gradient(180deg,#5a4a40,#3a2c24);border-color:#4a3a2b;color:#c9b9a2;box-shadow:0 3px 0 #1d1611}
#spd{position:relative}#spd .spl{position:absolute;right:-5px;top:-8px;height:16px;padding:0 4px;border-radius:8px;background:#0e0a07;border:1px solid #6a5a48;color:#c9b9a2;font:900 9px Nunito,system-ui,sans-serif;display:flex;align-items:center;gap:1px}
#spd.spdnew{animation:spdnew .9s ease-out 3}@keyframes spdnew{0%{box-shadow:0 0 0 0 rgba(255,201,74,.9);transform:scale(1)}40%{transform:scale(1.18)}100%{box-shadow:0 0 0 16px rgba(255,201,74,0);transform:scale(1)}}
body.full[data-v=pass] #toast{top:auto;bottom:calc(var(--navh) + 10px);max-width:250px}body.full[data-v=prog] #toast{top:auto;bottom:calc(var(--navh) + 72px);max-width:300px}   /* Passe e Progresso: o aviso global cai sobre a paginação, nunca sobre abas, cabeçalho ou botão */
body.resui #ftop,body.resui #colL,body.resui #colR,body.resui #skills,body.resui #hpe,body.resui #ulttip{display:none!important}body.resui #hud,body.resui #tabs{visibility:hidden}
@keyframes bossglow{0%,100%{box-shadow:0 3px 0 #5a140d,0 0 6px rgba(255,201,74,.5)}50%{box-shadow:0 3px 0 #5a140d,0 0 24px 6px rgba(255,201,74,1);border-color:#ffc94a}}
#stg{font-family:'Lilita One',Nunito,sans-serif;font-size:20px;text-shadow:0 2px 0 #000}
#wvp{display:flex;gap:4px;align-items:center;margin-top:2px;min-height:12px}
#wvp i{width:22px;height:6px;border-radius:3px;background:rgba(255,255,255,.3);transition:background .3s}#wvp i.on{background:#ffc94a}
#wvp b{font-size:11px;font-weight:900;color:#ffb3a8;margin-left:2px}
#wv{flex:none;display:flex;align-items:center;gap:8px;font-size:11px;font-weight:900;color:#fff;text-shadow:0 1px 2px #000}
#wv .bar{flex:1;height:10px;border-radius:6px;background:rgba(0,0,0,.55);border:1px solid rgba(0,0,0,.6)}
#wvb{background:linear-gradient(180deg,#ff7a5c,#d63b26);transition:width .4s}
#colR,#colL{top:110px;gap:10px}#colR{right:10px}#colL{left:10px}
#skills{bottom:10px}
body.sheet #skills{top:auto;bottom:calc(var(--apph,844px)*0.6 - var(--navh) + 4px)}
body.sheet #ftop{display:none}
#toast{top:calc(var(--hudh) + 20px)}
body.full #toast{top:calc(var(--hudh) + 150px);max-width:210px;font-size:13px}   /* telas cheias: o aviso cai no miolo (pedestal / palco do baú), nunca em cabeçalho nem em rótulo de espaço */
/* 5 abas, como no protótipo: Batalha, Equip., Invocar, Loja, Passe */
#tabs{background:#1d1611;border-top:2px solid #4a3a2b;padding:6px 6px calc(8px + env(safe-area-inset-bottom));gap:4px;box-sizing:border-box;font-family:Nunito,system-ui,sans-serif}
#tabs button{min-height:0;height:100%;border:0;border-radius:14px;color:#c9b9a2;font-size:11px;font-weight:900;gap:2px;padding:0;justify-content:center;background:none}
#tabs button.on{background:#3a2c1f;color:#ffc94a;border:0}
#tabs button .ti{height:28px;font-size:0}#tabs button .ti img{width:28px;height:28px;object-fit:contain}
.ti small{position:absolute;top:-4px;right:-12px;min-width:16px;height:16px;border-radius:8px;background:#ff4d3d;color:#fff;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid #16110d;padding:0 2px;box-sizing:content-box}
/* rótulos das habilidades colados nos botões; o selo "+N" da fila fica na linha do chão: os dois não se cruzam */
.skb .skn{bottom:calc(100% + 1px)}.skb.ult .skn{bottom:calc(100% + 4px);right:-2px}
/* ===== TELA 04 BATALHA (canvas aprovado): colunas, vida/energia, habilidades com o rótulo embaixo ===== */
#colR button,#colL>button{width:52px;height:44px;min-height:0;border-radius:14px;border:2px solid #4a3a2b;background:rgba(29,22,17,.88);color:#f6ecdf;font-family:'Lilita One',Nunito,sans-serif;font-weight:400;font-size:18px;padding:0;display:flex;align-items:center;justify-content:center}
#colR #skauto{width:52px;padding:0;font-size:13px;transition:background .2s}
#colR #skauto.on{border-color:#ffc94a;color:#2a1403;background:linear-gradient(180deg,#ffe07a,#f2a826)}
#colR #skauto:not(.on){font-size:11px}
#musb.on{border-color:#ffc94a;background:linear-gradient(180deg,#ffe07a,#f2a826);color:#2a1403}#musb.off{opacity:1}
#musb .eq{display:flex;gap:2px;align-items:flex-end;height:14px}#musb .eq i{width:3px;background:#2a1403;border-radius:1px;animation:eqa .9s ease-in-out infinite}
#musb .eq i:nth-child(2){animation-delay:.2s}#musb .eq i:nth-child(3){animation-delay:.4s}
@keyframes eqa{0%,100%{height:4px}50%{height:14px}}
#colL>#msb{position:relative;height:52px;color:#ffc94a}
#msn{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:#ff4d3d;color:#fff;font:900 12px Nunito,sans-serif;display:flex;align-items:center;justify-content:center;border:2px solid #16110d;box-sizing:border-box}
#hpe{position:absolute;left:12px;bottom:16px;width:150px;display:flex;flex-direction:column;gap:3px;z-index:2;font-family:Nunito,system-ui,sans-serif;color:#f6ecdf;pointer-events:none;text-shadow:0 1px 2px #000}
#hpe .hr{display:flex;justify-content:space-between;font-size:11px;font-weight:900}#hpe .hr+.hb+.hr{margin-top:3px}
#hpe .hb{height:12px;border-radius:6px;background:rgba(0,0,0,.6);border:1px solid #000;overflow:hidden}#hpe .hb.e{height:8px;border-radius:5px}
#hpb{display:block;height:100%;width:100%;background:linear-gradient(180deg,#7ee27a,#3fae3c);transition:width .2s}
#enb{display:block;height:100%;width:0;background:linear-gradient(90deg,#8a4dff,#d07bff);transition:width .2s}
#skills{right:12px;left:auto;bottom:14px}
.skr{gap:10px}
.skw{display:flex;flex-direction:column;align-items:center;gap:2px}.skw:nth-child(1){width:48px}.skw:nth-child(2){width:62px}.skw:nth-child(3){width:80px}
.skl{font:900 10px Nunito,system-ui,sans-serif;color:#e8dccb;text-shadow:0 1px 2px #000;white-space:nowrap}
.skb,.skb.s1,.skb.ult{background:#1d1611;box-shadow:none;overflow:hidden;opacity:1}
.skb.s1{width:48px;height:48px;border-radius:14px;border:2px solid #4a3a2b}
.skb.s2{width:62px;height:62px;border-radius:16px;border:2px solid #4aa3ff}
.skb.ult{width:80px;height:80px;border-radius:50%;border:3px solid #6a5a8a}
.skb img{border-radius:0}
.skb .skc{position:absolute;left:0;right:0;bottom:0;top:auto;height:calc(var(--p)*1%);border-radius:0;background:rgba(0,0,0,.65);transition:height .25s linear}
.skb .skt{font-family:'Lilita One',Nunito,sans-serif;font-weight:400;font-size:22px;text-shadow:0 2px 0 #000}
.skb.ult .skt{inset:auto 0 6px 0;font-size:14px}
.skb.ult.rdy{border-color:#d07bff;animation:ultr 1.2s ease-in-out infinite}
@keyframes ultr{0%,100%{box-shadow:0 0 10px rgba(208,123,255,.6)}50%{box-shadow:0 0 30px rgba(208,123,255,1)}}
#ulttip{position:absolute;right:104px;bottom:120px;display:flex;flex-direction:column;align-items:flex-end;gap:4px;pointer-events:none;z-index:3;font-family:Nunito,system-ui,sans-serif}
#ulttip span{padding:8px 12px;border-radius:12px;background:#f6ecdf;color:#2a1403;font-size:13px;font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.4)}
#ulttip .finger{margin-right:20px;animation:tapf 1s ease-in-out infinite}
@keyframes tapf{0%,100%{transform:translate(0,0)}50%{transform:translate(-6px,-8px) scale(.92)}}
#lvb.lvlglow{animation:lvlglow .5s ease-in-out 4 both}
@keyframes lvlglow{0%,100%{box-shadow:0 0 0 rgba(95,240,207,0)}50%{box-shadow:0 0 18px 6px rgba(95,240,207,1)}}
#hud .hpill.cbump{animation:cbump .35s ease-out}
@keyframes cbump{0%{transform:scale(1)}40%{transform:scale(1.18);box-shadow:0 0 12px rgba(255,201,74,.9)}100%{transform:scale(1)}}
/* esconder interface (botão do olho): some tudo do campo, menos o próprio botão */
body.hideui #ftop,body.hideui #colL,body.hideui #skills,body.hideui #hpe,body.hideui #ulttip,body.hideui #colR>button:not(#hideb){display:none}
body.hideui #hideb{opacity:.6}
/* com painel aberto (Passe): só as habilidades, pequenas, na faixa entre os pés e o painel */
body.sheet #hpe,body.sheet #ulttip,body.sheet .skl,body.full #ulttip{display:none}
body.sheet .skb,body.sheet .skb.ult,body.sheet .skb.s2{width:32px;height:32px;border-width:2px}body.sheet .skb.s1{display:none}body.sheet .skb .skt,body.sheet .skb.ult .skt{font-size:11px;inset:0}
#hud .hn1{overflow:hidden;text-overflow:ellipsis}
/* Passe: abas internas (Passe | Missões) */
.ptabs{display:flex;gap:6px;margin:0 0 8px}.ptabs button{flex:1;height:40px;border-radius:12px;border:2px solid #4a3a2b;background:#33271d;color:#c9b9a2;font:400 14px 'Lilita One',Nunito,sans-serif;position:relative}
.ptabs button.on{border-color:#ffc94a;background:linear-gradient(180deg,#ffe07a,#f2a826);color:#2a1403}
.ptabs small{position:absolute;top:-6px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:#ff4d3d;color:#fff;font:900 11px Nunito,sans-serif;display:flex;align-items:center;justify-content:center;border:2px solid #16110d}
</style>
</head>

  o.type=type||'square'; o.frequency.value=f; g.gain.value=v||0.03; g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+d); o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+d); }catch(e){} }

  const s=SYN[name]||(/_s3$/.test(name)?[140,.5,'sawtooth']:/_s2$/.test(name)?[240,.2]:/_s1$/.test(name)?[330,.06]:null); if(s) sfx(s[0],s[1],s[2]); }

   Nível do item, custos e melhoria: Sys.stats (upgradeCost / canUpgrade / upgrade / planUpgrade / upgradeTo). Desmontar: Sys.loot.dismantle. */
function heroStats(){ if(window.Sys&&Sys.fc&&Sys.stats&&Sys.host) return Sys.fc.stats(S,Sys.host); return {atk:5,hp:100,def:0,critRate:12,critDmg:100,aspd:0}; }

/* FC RECOMENDADA DA FASE (modo farm e tela de derrota). Nenhum módulo expõe essa função; a fonte é docs/balance.json →
   tower.fc_mediana_do_gratis_no_fim_de_cada_era (FC mediana do grátis ao derrubar o Senhor de cada era), interpolada geometricamente dentro da era
   a partir da FC do fim da era anterior (era 0: a partir de REC_FC0, a FC do jogador novo). O carregador troca REC_FC pelo valor do arquivo. */
let REC_FC=[1440,12300,395000,13900000,829000000,34300000000,1540000000000]; const REC_FC0=264, BOSS_GLOW_AT=0.9;   // o botão "Desafiar" brilha com a FC em 90% da recomendada
function recFC(stage){ const e=eraOf(stage), inEra=((stage-1)%STAGES_PER_ERA)+1, a=e>0?REC_FC[e-1]:REC_FC0, b=REC_FC[e]; return Math.round(a*Math.pow(b/a,inEra/STAGES_PER_ERA)); }

  const tot=RAR.reduce((s,r)=>s+r[key],0); let x=Math.random()*tot;
  for(let i=0;i<RAR.length;i++){ x-=RAR[i][key]; if(x<=0) return i; } return 0;
}

/* VELOCIDADE (regra do dono): x1 no começo; x2 com qualquer VIP ou nível 15; x4 só com VIP 5+ e nível 40+. A regra é do Sys.vip.maxSpeed(S, host);
   no jogo, o ponto único é canSpeed(n). O botão alterna só entre as liberadas; a próxima bloqueada aparece com cadeado e o toque mostra o motivo. */
function speedInfo(){ try{ const m=Sys.vip.maxSpeed(S,Sys.host); return {ok:[1].concat(m.speeds.filter(x=>x.unlocked).map(x=>x.speed)),next:m.next,max:m.max}; }catch(e){ return {ok:[1],next:null,max:1}; } }

/* ABRIR E FECHAR TELAS POR UMA FUNÇÃO ÚNICA (PO): os painéis não dependem da barra de abas para existir, entrar ou sair; a barra só chama Screens.open.
   Screens.open('pass',{tab:'missions'|'rewards'}) · Screens.open('progress',{tab:'practice'|'titles'}) · Screens.open('result',{mode:'win'|'lose',...}) · Screens.close() */
const Screens={
  /* PONTO DE EXTENSÃO (pedido B-3): Screens.register(nome, {title, render(el, S), onOpen(opções), onClose()}) registra uma tela cheia sem editar este
     arquivo. Depois disso Screens.open(nome) abre (o render é chamado a cada redesenho, com el = #view), Screens.close() fecha, o título aparece no
     cabeçalho do painel e, se o nome for uma chave do MENU da batalha (forge, pets, tower, inst, rank, vip, mail, events), o item deixa de dizer "Em breve". */
  reg:{},
  register(name,def){ if(!name||FULLV[name]&&!this.reg[name]) return false; this.reg[name]=def||{}; FULLV[name]=1; return true; },
  open(name,o){ o=o||{};
    if(this.reg[name]){ const d=this.reg[name]; setView(name); if(typeof d.onOpen==='function'){ try{ d.onOpen(o); }catch(e){ console.error('Screens.onOpen',e); } } return true; }
    if(name==='pass'||name==='missions'){ passTab=(name==='missions'||o.tab==='missions'||o.tab==='mis')?'mis':'pass'; setView('pass'); }
    else if(name==='progress'||name==='prog'){ if(!SCREENS_ON.progress) return false; if(typeof XR!=='undefined'){ XR.tab=o.tab==='titles'?'tit':'prac'; XR.back=view==='prog'?XR.back:view; } setView('prog'); }
    else if(name==='result'){ return typeof resOpen==='function'&&resOpen(o.mode||'win',o,true); }
    else setView(name);
    return true; },
  close(){ if(typeof B!=='undefined'&&B.res&&typeof resClose==='function'){ resClose('close'); return; }
    if(this.reg[view]){ const d=this.reg[view]; setView('battle'); if(typeof d.onClose==='function'){ try{ d.onClose(); }catch(e){ console.error('Screens.onClose',e); } } return; }
    if(view==='prog'){ setView(typeof XR!=='undefined'&&XR.back&&XR.back!=='prog'?XR.back:'gear'); return; }
    if(view!=='battle') setView('battle'); },
  current(){ return (typeof B!=='undefined'&&B.res)?'result':view==='prog'?'progress':view; } };
window.Screens=Screens;

const PASS_OK = () => !!(window.Sys&&Sys.pass&&Sys.host);
/* evento de missão: kill · boss · ult · chest · instance · forge · summon · upgrade */
function ptrack(ev,n){ const v=n==null?1:n;
  if(PASS_OK()){ try{ Sys.pass.track(S,Sys.host,ev,v); }catch(e){} }
  if(window.Sys&&Sys.events&&typeof Sys.events.track==='function'){ try{ Sys.events.track(S,Sys.host,ev,v); }catch(e){} }   /* missões do Festival (módulo desligado por chave: a chamada não faz nada até ligarem) */
}
/* pedras de forja coletadas (Sys.loot.todayCount) e baús abertos (S.sys.chest.opened): os módulos não avisam, então o jogo compara os contadores */
function passSync(){ if(!PASS_OK()||!Sys.loot||!Sys.chest) return;
  try{ const day=Sys.pass.dayKey(Date.now()), f=Sys.loot.todayCount(S,Sys.host,'forge'), c=Sys.chest.ensure(S).opened; let o=S.psync;
    if(!o){ o=S.psync={day,forge:f,chest:c}; } else if(o.day!==day){ o.day=day; o.forge=0; }
    if(f>o.forge) ptrack('forge',f-o.forge); o.forge=f; if(c>o.chest) ptrack('chest',c-o.chest); o.chest=c; }catch(e){} }
function missionAlerts(){ if(!PASS_OK()) return 0; try{ const L=Sys.pass.list(S,Sys.host); return L.daily.concat(L.weekly).filter(m=>m.done&&!m.claimed).length+(L.bonus.ready&&!L.bonus.claimed?1:0); }catch(e){ return 0; } }
function passAlerts(){ if(!PASS_OK()) return 0; try{ return Math.max(0,Sys.pass.alerts(S,Sys.host)-missionAlerts()); }catch(e){ return 0; } }

/* ================= LOJA (moedas e diamantes) ================= */
function hash(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function rngSeed(seed){ let a=seed; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const COIN_BASE=[150,420,1300,4000,12000];
const itemPrice=(r,e)=>Math.floor(COIN_BASE[r]*Math.pow(4,e));
const SKIN_PRICE=[30,60,120,250,500];
/* pacotes de skin sorteada: REMOVIDOS (o dono proibiu sorteio de skin). Skin só por venda direta (skins do dia) e no passe. */
function ensureShop(){
  const k=todayKey(); if(S.shop&&S.shop.date===k) return;
  const rnd=rngSeed(hash(k+'|'+S.eraMax)), rs=[0,0,1,1,2,2];
  /* estoque do dia montado pelo Sys.loot.rollItem ({source:'shop'}, com os portões de raridade); a vitrine mostra o item inteiro e a compra é direta, sem sorteio */
  const sh=Object.assign({},window.Sys&&Sys.host,{rng:rnd});
  const offers=rs.map((r,i)=>{ let o; if(window.Sys&&Sys.loot){ const it=normItem(Sys.loot.rollItem(sh,{source:'shop',minR:r})); o={slot:it.slot,r:it.r,e:it.e,subs:it.subs}; } else o={slot:i%2?'armor':'weapon',r,e:(S.eraMax>0&&rnd()<.3)?S.eraMax-1:S.eraMax,subs:[]};
    return {slot:o.slot,r:o.r,e:o.e,subs:o.subs,price:itemPrice(o.r,o.e),sold:false}; });   /* o item inteiro fica na vitrine (espaço, era, raridade, secundários): compra direta, sem sorteio */
  const pool=SKINS.filter(x=>!x.pass&&x.e<=S.eraMax&&!S.skins.includes(x.id));
  const skins=[]; while(skins.length<4&&pool.length){ skins.push(pool.splice(Math.floor(rnd()*pool.length),1)[0].id); }
  S.shop={date:k,offers,skins}; save();
}

const modal=document.getElementById('modal'), mbox=document.getElementById('mbox');
function closeModal(){ modal.style.display='none'; }
/* O index.html não tem "?v=": o celular pode guardar a página antiga. Ao carregar, compara a VERSION com version.json (buscado sem cache);
   se for diferente, recarrega com um parâmetro novo (_v=<versão>), o que força a busca do index novo. Não repete se já recarregou para essa versão. */
function versionCheck(){ if(DEBUG) return;
  fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{ const v=j&&j.version; if(!v||v===VERSION) return;
    const u=new URL(location.href); if(u.searchParams.get('_v')===v) return; u.searchParams.set('_v',v); save(); location.replace(u.toString()); }).catch(()=>{}); }
function openSettings(confirmReset){
  mbox.innerHTML=confirmReset?`<h3>Resetar progresso?</h3><div class="sm">Isso apaga TODO o seu progresso, itens, skins e moedas. Não dá para desfazer.</div>
    <div class="row"><button class="btn dim grow" id="m_no">Cancelar</button><button class="btn grow" style="background:linear-gradient(#e05555,#a02020);color:#fff" id="m_yes">Apagar tudo</button></div>`
  :`<h3>⚙️ Configurações</h3>
    <div class="row"><div class="grow">Som</div><button class="btn ${S.set.sound?'':'dim'}" id="m_snd">${S.set.sound?'Ligado':'Desligado'}</button></div>
    <div class="row"><div class="grow">Vibração</div><button class="btn ${S.set.vib?'':'dim'}" id="m_vib">${S.set.vib?'Ligada':'Desligada'}</button></div>
    <div class="row"><div class="grow">Desafiar o chefe sozinho<div class="sm">quando a sua FC chegar à recomendada da fase</div></div><button class="btn ${S.set.autoBoss?'':'dim'}" id="m_ab">${S.set.autoBoss?'Ligado':'Desligado'}</button></div>
    <div class="row"><div class="grow">Progresso</div><button class="btn dim" id="m_rst">Resetar</button></div>
    <div class="sm" style="margin-top:10px">${GAME_NAME} · ${VERSION}${DEBUG?' · DEBUG':''}</div>
    <div class="row"><button class="btn grow" id="m_ok">Fechar</button></div>`;
  modal.style.display='flex';
  const on=(id,fn)=>{ const el=document.getElementById(id); if(el) el.onclick=fn; };
  on('m_ok',closeModal); on('m_no',()=>openSettings(false));
  on('m_vib',()=>{ S.set.vib=!S.set.vib; save(); openSettings(false); vib(30); });
  on('m_ab',()=>{ S.set.autoBoss=!S.set.autoBoss; save(); openSettings(false); });
  on('m_snd',()=>{ setTimeout(syncMus,0); S.set.sound=!S.set.sound; if(window.GameAudio&&GameAudio.setEnabled){ try{ GameAudio.setEnabled(S.set.sound); }catch(e){} } save(); openSettings(false); snd('ui_tap'); });
  on('m_rst',()=>openSettings(true));
  on('m_yes',()=>{ window.__noSave=true; try{ localStorage.removeItem(SAVE_KEY); }catch(e){} location.href=location.pathname+location.search; });
}
