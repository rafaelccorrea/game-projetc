<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Eonbound — Códex das Eras</title>
<script src="./support.js"></script>
</head>
<body>
<!-- Códex v2 (refeito após reprovação: "visual fraco, ícones provisórios em SVG, coisa demais").
     SIMPLES: álbum com 6 cartões grandes (Armas · Armaduras · Pets · Montarias · Bestiário · Auras), só arte REAL subida ao canvas.
     Armas: 3 por era (t0 Básico, t1 Épico, t2 Lendário), eras 0-6. Armaduras: só os ícones de espaço com arte (era 2 completa; eras 0/1 parciais; coletes 3-6).
     Montarias: as 6 com arte (Pônei, Cavalo de guerra, Lobo de guerra, Grifo dourado, Tigre de cristal, Serpe dourada). Bestiário: só inimigos/chefes com arte aprovada.
     Categoria = faixas por ERA roláveis na horizontal, um seletor Todos · Tenho · Falta. Ficha: arte grande, raridade, 1 linha, Onde conseguir + Ir.
     Topo: % total e só o PRÓXIMO marco de prêmio (quantidades [QTD] com o PO). Layout novo: sem barra de baixo, header da Batalha V2 com VOLTAR. -->
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Nunito,system-ui,sans-serif;color:#f6ecdf;background:#16110d}
html,body{height:100%}
*{box-sizing:border-box}
a{color:#ffc94a}
button{font-family:Nunito,system-ui,sans-serif;cursor:pointer;color:#f6ecdf;-webkit-tap-highlight-color:transparent}
.lil{font-family:'Lilita One',sans-serif;font-weight:400;letter-spacing:.2px}

/* ===== animações ===== */
@keyframes sheet{from{background-position:0 0}to{background-position:100% 0}}
@keyframes ei{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.035)}}
@keyframes drift{from{background-position:0 0}to{background-position:-1200px 0}}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes shine{0%,55%{transform:translateX(-140%) skewX(-20deg)}100%{transform:translateX(260%) skewX(-20deg)}}
@keyframes glowB{0%,100%{box-shadow:0 0 0 2px var(--rc),0 0 10px rgba(var(--rg),.35)}50%{box-shadow:0 0 0 2px var(--rc),0 0 22px rgba(var(--rg),.8)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(4deg)}}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 4px 0 #8a4f0c,0 0 0 0 rgba(255,201,74,.6)}50%{transform:scale(1.06);box-shadow:0 4px 0 #8a4f0c,0 0 0 8px rgba(255,201,74,0)}}
@keyframes halo{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}
@keyframes spark{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}

/* ===== arte aprovada ===== */
.kidle{background-image:url(/_blob/579019ed03216cec9c8ba3c275bdff17);background-size:1200% 100%;background-repeat:no-repeat;animation:sheet 1s steps(12, jump-none) infinite}
.au13,.au10,.au7{background-size:1600% 100%;background-repeat:no-repeat;animation:sheet 1.333s steps(16, jump-none) infinite}
.au13{background-image:url(/_blob/76eb68fb1277fd16b380293b2c5b5c77)}
.au10{background-image:url(/_blob/12c1278cafbd0597e44a6ed8d6a27ec4)}
.au7{background-image:url(/_blob/77c79b0f46d2e8ae8b53d9f6308c3206)}
.gIdle{background-image:url(/_blob/0024a72ae893244dd7cc9b50d5f6bf13);background-size:1200% 100%;background-repeat:no-repeat;background-position:0 0;animation:ei 1.4s ease-in-out infinite;transform-origin:50% 95%}
.sIdle{background-image:url(/_blob/ca69f41bfb4a37a1fcb54bc06614f1ae);background-size:1200% 100%;background-repeat:no-repeat;background-position:0 0;animation:ei 1.6s ease-in-out infinite;transform-origin:50% 95%}
.gAtk{background-image:url(/_blob/0024a72ae893244dd7cc9b50d5f6bf13);background-size:1200% 100%;background-repeat:no-repeat;animation:sheet 1s steps(12, jump-none) infinite}
.sAtk{background-image:url(/_blob/ca69f41bfb4a37a1fcb54bc06614f1ae);background-size:1200% 100%;background-repeat:no-repeat;animation:sheet 1s steps(12, jump-none) infinite}
.sky{background-image:url(/_blob/76d16952e1067c864246744b4de14ec2);background-size:cover;background-position:50% 30%}
.cld{background-image:url(/_blob/2325ac84d4473d6f98d442c2f25e8041);background-size:auto 100%;background-repeat:repeat-x;animation:drift 120s linear infinite}

/* ===== HEADER NOVO (igual Batalha tela cheia V2) ===== */
.nhApp{position:relative;width:100%;height:100vh;height:100dvh;min-height:520px;overflow:hidden;display:flex;flex-direction:column;font-family:Nunito,system-ui,sans-serif;color:#f6ecdf;background:#16110d}
.nhGl{background:rgba(16,11,8,.56);-webkit-backdrop-filter:blur(8px) saturate(1.2);backdrop-filter:blur(8px) saturate(1.2);border:1px solid rgba(255,236,200,.16);box-shadow:0 6px 16px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08)}
.nh{position:relative;z-index:20;flex:none;display:flex;align-items:center;gap:8px;min-height:60px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:linear-gradient(180deg,rgba(12,8,6,.92),rgba(12,8,6,.62));border-bottom:1px solid rgba(255,236,200,.12)}
.nhBk{width:44px;height:44px;flex:none;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#f6ecdf;text-decoration:none;padding:0;transition:transform .12s}
.nhBk:active{transform:scale(.9)}
.nhT{flex:1;min-width:0;margin:0;text-align:center;font-family:'Lilita One',sans-serif;font-weight:400;font-size:clamp(18px,5.6vw,24px);line-height:1.15;color:#fff;text-shadow:0 2px 0 #120c08,0 0 8px rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nhP{flex:none;display:flex;align-items:center;gap:6px}
.nhB{height:44px;display:flex;align-items:center;padding:0;border:0;background:none;text-decoration:none;color:#f6ecdf}
.nhB:active .nhPill{transform:scale(.94)}
.nhPill{height:38px;display:flex;align-items:center;gap:5px;padding:0 10px 0 6px;border-radius:999px;color:#f6ecdf}
.nhPill img{width:24px;height:24px;object-fit:contain}
.nhPill b{font-size:13.5px;font-weight:900}

/* ===== fundo vivo ===== */
.bgS{position:absolute;left:0;right:0;top:0;height:46%;opacity:.32;pointer-events:none;-webkit-mask-image:linear-gradient(180deg,#000 30%,transparent);mask-image:linear-gradient(180deg,#000 30%,transparent)}
.bgC{position:absolute;left:0;right:0;top:40px;height:120px;opacity:.28;pointer-events:none}
.body{position:relative;z-index:1;flex:1;min-height:0;width:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column;padding:10px 12px max(12px,env(safe-area-inset-bottom))}

/* ===== topo: % total + próximo marco ===== */
.top{flex:none;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;animation:rise .45s ease-out both}
.pct{flex:none;font-size:40px;line-height:1;color:#ffc94a;text-shadow:0 3px 0 #6a3a08}
.pct small{font-size:20px}
.tMid{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.tSub{font-size:12.5px;font-weight:800;color:#c9b9a2}
.bar{position:relative;height:12px;border-radius:99px;background:#0e0a07;box-shadow:inset 0 1px 3px rgba(0,0,0,.7);overflow:visible}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,#f2a826,#ffe07a);transform-origin:0 50%;animation:grow .9s cubic-bezier(.2,.8,.2,1) both .2s}
.bar .mk{position:absolute;top:-4px;width:4px;height:20px;margin-left:-2px;border-radius:2px;background:#f6ecdf;box-shadow:0 0 6px rgba(255,236,200,.8)}
.nxt{flex:none;min-width:98px;height:56px;display:flex;align-items:center;gap:6px;padding:0 10px 0 6px;border-radius:14px;border:1px solid #4a3a2b;background:#1d1611;text-align:left}
.nxt img{width:36px;height:36px;object-fit:contain;flex:none}
.nxt span{display:flex;flex-direction:column;font-size:11px;font-weight:800;color:#c9b9a2;line-height:1.2}
.nxt span b{font-family:'Lilita One',sans-serif;font-weight:400;font-size:16px;color:#f6ecdf}
.nxt.ready{border:0;background:linear-gradient(180deg,#ffe07a,#f2a826);animation:pulse 1.2s ease-in-out infinite}
.nxt.ready span,.nxt.ready span b{color:#2a1403}

/* ===== álbum: cartões grandes ===== */
.cards{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;overflow-y:auto;padding:2px;margin-top:10px}
.card{position:relative;flex:1 1 0;min-height:76px;max-height:150px;display:flex;align-items:stretch;padding:0;border:0;border-radius:20px;overflow:hidden;text-align:left;background:#1d1611;box-shadow:0 0 0 1.5px rgba(var(--cg),.55),0 8px 18px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);animation:rise .5s cubic-bezier(.2,.8,.2,1) both;transition:transform .12s}
.card:active{transform:scale(.97)}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 120% at 82% 60%,rgba(var(--cg),.42),transparent 70%),linear-gradient(90deg,#1d1611 30%,rgba(29,22,17,0) 100%)}
.card::after{content:"";position:absolute;top:0;bottom:0;left:0;width:34%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.10),transparent);animation:shine 5s ease-in-out infinite;animation-delay:inherit;pointer-events:none}
.cA{--cg:255,201,74}.cR{--cg:74,163,255}.cM{--cg:95,208,104}.cP{--cg:255,138,58}.cB{--cg:255,90,78}.cU{--cg:176,124,255}
.cTx{position:relative;z-index:2;flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:12px 0 12px 16px}
.cN{font-size:clamp(24px,7vw,30px);line-height:1;color:#fff;text-shadow:0 3px 0 #120c08}
.cBar{position:relative;height:10px;width:100%;max-width:170px;border-radius:99px;background:#0e0a07;box-shadow:inset 0 1px 3px rgba(0,0,0,.7);overflow:hidden}
.cBar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,rgb(var(--cg)),#fff2c4);transform-origin:0 50%;animation:grow .9s cubic-bezier(.2,.8,.2,1) both .35s}
.cCt{font-size:13px;font-weight:800;color:#c9b9a2}
.cCt b{font-family:'Lilita One',sans-serif;font-weight:400;font-size:17px;color:#f6ecdf}
.cArt{position:relative;z-index:1;flex:none;width:44%;max-width:210px}
.cGo{position:relative;z-index:2;flex:none;width:30px;display:flex;align-items:center;justify-content:center;color:rgba(255,236,200,.7)}
.ped{position:absolute;left:12%;right:12%;bottom:7%;height:14%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.6),transparent)}
.halo{position:absolute;left:10%;right:10%;top:8%;bottom:8%;border-radius:50%;background:radial-gradient(closest-side,rgba(var(--cg),.55),transparent);animation:halo 2.6s ease-in-out infinite}
.stand{position:absolute;left:6%;right:6%;top:6%;bottom:10%;display:block;width:88%;height:84%;object-fit:contain;object-position:50% 100%;transform-origin:50% 100%;animation:ei 1.8s ease-in-out infinite}
.wpn{position:absolute;left:14%;right:14%;top:8%;bottom:12%;display:block;width:72%;height:80%;object-fit:contain;transform-origin:50% 85%;animation:sway 3.2s ease-in-out infinite;filter:drop-shadow(0 0 10px rgba(255,201,74,.55))}
.auraBox{position:absolute;left:50%;bottom:8%;height:96%;aspect-ratio:256/320;transform:translateX(-50%)}
.auraBox .au{position:absolute;inset:0}
.auraBox .kl{position:absolute;left:2%;right:2%;bottom:0;aspect-ratio:1/1}
.sp{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff6d0;box-shadow:0 0 8px #ffc94a;animation:spark 2.2s ease-in-out infinite}

/* ===== categoria ===== */
.seg{flex:none;display:flex;gap:4px;padding:4px;border-radius:16px;background:#0e0a07;border:1px solid #4a3a2b;animation:rise .35s ease-out both}
.seg button{flex:1;height:44px;border:0;border-radius:12px;background:transparent;font-size:15px;font-weight:900;color:#c9b9a2;transition:background .15s,color .15s}
.seg button.on{background:linear-gradient(180deg,#ffe07a,#f2a826);color:#2a1403;box-shadow:0 3px 0 #8a4f0c}
.cProg{flex:none;display:flex;align-items:center;gap:10px;margin:10px 2px 4px;font-size:13px;font-weight:800;color:#c9b9a2}
.cProg b{font-family:'Lilita One',sans-serif;font-weight:400;font-size:18px;color:#f6ecdf}
.cProg .bar{flex:1;height:10px}
.list{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;margin:0 -12px;padding:4px 0 12px}
.band{margin-top:10px;animation:rise .45s ease-out both}
.bH{display:flex;align-items:baseline;justify-content:space-between;padding:0 16px 6px}
.bH .lil{font-size:19px;color:#f6ecdf;text-shadow:0 2px 0 #120c08}
.bH span:last-child{font-size:12.5px;font-weight:800;color:#c9b9a2}
.row{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;padding:4px 16px 8px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.cell{flex:none;width:92px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0;border:0;background:none;scroll-snap-align:start;animation:pop .4s cubic-bezier(.2,.8,.2,1) both}
.cell:active .fr{transform:scale(.93)}
.fr{position:relative;width:88px;height:88px;border-radius:18px;overflow:hidden;background:radial-gradient(80% 80% at 50% 40%,rgba(var(--rg),.38),#1d1611 75%);box-shadow:0 0 0 2px var(--rc),0 6px 12px rgba(0,0,0,.4);transition:transform .12s}
.fr.glow{animation:glowB 2s ease-in-out infinite}
.fr.shn::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:shine 3.4s ease-in-out infinite}
.fr .art{position:absolute;left:8%;top:8%;width:84%;height:84%}
.fr img.art{object-fit:contain;object-position:50% 100%;transform-origin:50% 100%;animation:ei 1.9s ease-in-out infinite}
.fr img.art.w{object-position:50% 50%;animation:sway 3.4s ease-in-out infinite;transform-origin:50% 85%}
.fr img.art.ic,.wpn.ic{object-position:50% 50%;transform-origin:50% 50%;animation:breathe 2.4s ease-in-out infinite}
.fr .auraBox{height:100%;bottom:0}
.miss .fr{background:radial-gradient(80% 80% at 50% 40%,#2a211a,#120d0a 75%);box-shadow:0 0 0 2px rgba(var(--rg),.45),0 6px 12px rgba(0,0,0,.4)}
.miss .art,.miss .auraBox{filter:brightness(0);opacity:.78}
.q{position:absolute;right:6px;bottom:4px;font-family:'Lilita One',sans-serif;font-size:18px;color:rgba(201,185,162,.75);text-shadow:0 1px 0 #000}
.tN{width:100%;font-size:12px;font-weight:800;line-height:1.15;text-align:center;color:#f6ecdf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.miss .tN{color:#8f806c}
.r0{--rc:#e8e2d8;--rg:232,226,216}.r1{--rc:#4aa3ff;--rg:74,163,255}.r2{--rc:#b07cff;--rg:176,124,255}.r3{--rc:#ff5a5a;--rg:255,90,90}.r4{--rc:#ffc94a;--rg:255,201,74}.r5{--rc:#8ff5ff;--rg:143,245,255}
.empty{margin:40px 16px;text-align:center;font-size:15px;font-weight:800;color:#c9b9a2;animation:fadeIn .3s both}

/* ===== ficha ===== */
.shade{position:absolute;inset:0;z-index:40;background:rgba(8,5,3,.66);animation:fadeIn .2s both}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;max-width:640px;margin:0 auto;padding:14px 18px max(18px,env(safe-area-inset-bottom));border-radius:26px 26px 0 0;background:linear-gradient(180deg,#2a2018,#1d1611);box-shadow:0 0 0 1.5px rgba(var(--rg),.6),0 -10px 30px rgba(0,0,0,.6);animation:up .32s cubic-bezier(.2,.8,.2,1) both;display:flex;flex-direction:column;align-items:center;gap:8px}
.x{position:absolute;right:10px;top:10px;width:44px;height:44px;border-radius:14px;border:1px solid #4a3a2b;background:#16110d;display:flex;align-items:center;justify-content:center;color:#f6ecdf}
.stg{position:relative;width:200px;height:200px;margin-top:4px}
.stg .halo{--cg:var(--rg);left:0;right:0;top:4%;bottom:0}
.stg .ped{left:14%;right:14%;bottom:4%;height:12%}
.stg .stand{left:8%;right:8%;top:4%;bottom:9%;width:84%;height:87%}
.stg .wpn{left:16%;right:16%;width:68%}
.stg .big{position:absolute;left:4%;right:4%;bottom:8%;aspect-ratio:1/1}
.stg.miss .stand,.stg.miss .wpn,.stg.miss .big,.stg.miss .auraBox{filter:brightness(0) drop-shadow(0 0 8px rgba(var(--rg),.7))}
.stg.miss .halo{opacity:.25;animation:none}
.chip{height:26px;display:flex;align-items:center;padding:0 12px;border-radius:99px;font-size:13px;font-weight:900;color:#16110d;background:var(--rc)}
.fN{font-size:26px;line-height:1.05;text-align:center;color:#fff;text-shadow:0 3px 0 #120c08}
.fE{margin-top:-4px;font-size:13px;font-weight:800;color:#c9b9a2}
.fA{width:100%;padding:10px 12px;border-radius:14px;background:#16110d;border:1px solid #4a3a2b;text-align:center;font-size:15px;font-weight:900;color:#f6ecdf}
.src{width:100%;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-radius:16px;background:#33271d;border:1px solid #4a3a2b}
.src span{flex:1;min-width:0;display:flex;flex-direction:column;font-size:14px;font-weight:800;line-height:1.25;color:#f6ecdf}
.src span small{font-size:11.5px;font-weight:800;color:#c9b9a2;text-transform:uppercase;letter-spacing:.6px}
.go{flex:none;min-width:84px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:linear-gradient(180deg,#ffe07a,#f2a826);box-shadow:0 4px 0 #8a4f0c;color:#2a1403;font-family:'Lilita One',sans-serif;font-size:20px;text-decoration:none;transition:transform .1s}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 #8a4f0c}

.toast{position:absolute;left:50%;bottom:24px;z-index:60;transform:translateX(-50%);max-width:90%;padding:12px 18px;border-radius:16px;background:#33271d;border:1.5px solid #ffc94a;font-size:14px;font-weight:900;text-align:center;box-shadow:0 10px 24px rgba(0,0,0,.5);animation:rise .3s both}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important}}
</style>
</helmet>
<div class="nhApp">
  <span class="bgS sky" aria-hidden="true"></span>
  <span class="bgC cld" aria-hidden="true"></span>

  <!-- HEADER (igual Batalha V2): voltar · título · moedas/gemas -->
  <div class="nh">
    <sc-if value="{{isAlbum}}" hint-placeholder-val="{{true}}">
      <a href="BatalhaTelaCheiaV2.dc.html" onClick="{{tap}}" class="nhBk nhGl" aria-label="Voltar para a batalha">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </a>
    </sc-if>
    <sc-if value="{{isCat}}" hint-placeholder-val="{{false}}">
      <button onClick="{{back}}" class="nhBk nhGl" aria-label="Voltar para o álbum">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
    </sc-if>
    <span class="nhT" role="heading" aria-level="1">{{title}}</span>
    <div class="nhP">
      <a href="Loja.dc.html" onClick="{{tap}}" class="nhB" aria-label="Moedas: 48.200. Abrir loja"><span class="nhPill nhGl"><img src="/_blob/3f2502c864add38c4b3faf5853f0dd9a" alt=""><b>48,2K</b></span></a>
      <a href="Loja.dc.html" onClick="{{tap}}" class="nhB" aria-label="Gemas: {{gems}}. Abrir loja"><span class="nhPill nhGl"><img src="/_blob/1c420bdcae24bd962967021584f5bd64" alt="" style="width: 22px; height: 22px"><b>{{gems}}</b></span></a>
    </div>
  </div>

  <div class="body">
    <!-- ===== ÁLBUM ===== -->
    <sc-if value="{{isAlbum}}" hint-placeholder-val="{{true}}">
      <div class="top nhGl">
        <span class="pct lil" aria-label="{{pctAria}}">{{pct}}<small>%</small></span>
        <div class="tMid">
          <span class="tSub">{{totTxt}}</span>
          <div class="bar" aria-hidden="true"><i style="width: {{pctW}}"></i><span class="mk" style="left: {{mkX}}"></span></div>

];
var FILT = ['Todos', 'Tenho', 'Falta'];

function pctOf(a, b) { return b ? Math.floor(a * 100 / b) : 0; }

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { view: 'album', cat: 'pet', filt: 0, sel: null, claimed: { 10: true }, gems: 320, toast: '', tk: 0 };
  }
  sfx(u, v) { try { var a = new Audio(u); a.volume = v || 0.7; a.play().catch(function () {}); } catch (e) {} }
  say(t) {
    var k = this.state.tk + 1, self = this;
    this.setState({ toast: t, tk: k });
    setTimeout(function () { if (self.state.tk === k) self.setState({ toast: '' }); }, 2400);
  }
  artFor(it, big) {
    var a = it.art;
    return {
      isImg: a.t === 'img', isSheet: a.t === 'sheet', isAura: a.t === 'aura', src: a.src || '',
      imgCls: a.ic ? 'art ic' : a.w ? 'art w' : 'art', sheetCls: 'art ' + (a.cls || ''), auCls: 'au ' + (a.cls || ''),
      bigImgCls: a.ic ? 'wpn ic' : a.w ? 'wpn' : 'stand', bigSheetCls: 'big ' + (a.big || a.cls || '')
    };
  }
  renderVals() {
    var s = this.state, self = this;
    var tap = function () { self.sfx(SND.tap, 0.5); };
    var ownAll = ITEMS.filter(function (i) { return i.own; }).length, totAll = ITEMS.length, pct = pctOf(ownAll, totAll);

    // próximo marco: o primeiro não pego
    var nx = MILES.filter(function (m) { return !s.claimed[m.p]; })[0] || null;
    var ready = !!nx && pct >= nx.p;
    var need = nx ? Math.max(0, Math.ceil(nx.p * totAll / 100) - ownAll) : 0;

    var cards = CATS.map(function (c, i) {
      var its = ITEMS.filter(function (x) { return x.cat === c.k; });
      var own = its.filter(function (x) { return x.own; }).length, p = pctOf(own, its.length);
      return {
        n: c.n, cls: 'card ' + c.cls, own: own, tot: its.length, p: p, w: p + '%', dl: (0.08 + i * 0.08) + 's',
        aria: c.n + ': ' + own + ' de ' + its.length + ' (' + p + '%)',
        isImg: c.art.t === 'img', isAura: c.art.t === 'aura', src: c.art.src || '', imgCls: c.art.cls || '',
        open: function () { self.sfx(SND.tap, 0.5); self.setState({ view: 'cat', cat: c.k, filt: 0, sel: null }); }
      };
    });

    // categoria
    var cat = CATS.filter(function (c) { return c.k === s.cat; })[0];
    var cIts = ITEMS.filter(function (x) { return x.cat === s.cat; });
    var cOwn = cIts.filter(function (x) { return x.own; }).length, cP = pctOf(cOwn, cIts.length);
    var shown = cIts.filter(function (x) { return s.filt === 0 || (s.filt === 1 ? x.own : !x.own); });
    var groups = [], gIdx = {};
    shown.forEach(function (x) {
      var key = s.cat === 'pet' ? x.id.replace(/\d$/, '') : String(x.era);
      if (gIdx[key] === undefined) {
        var nm = x.era === -2 ? 'Estábulo' : x.era < 0 ? 'Forja da arma' : ERAN[x.era];
        if (s.cat === 'pet') nm = ERAN[x.era] + ' · ' + x.n;
        gIdx[key] = groups.length; groups.push({ key: key, n: nm, era: x.era, list: [] });
      }
      groups[gIdx[key]].list.push(x);
    });
    groups.sort(function (a, b) { return a.era - b.era; });
    var bands = groups.map(function (g, bi) {
      var all = cIts.filter(function (x) { return s.cat === 'pet' ? x.id.replace(/\d$/, '') === g.key : String(x.era) === g.key; });
      var o = all.filter(function (x) { return x.own; }).length;
      return {
        n: g.n, ct: o + '/' + all.length, dl: (0.05 + bi * 0.07) + 's',
        items: g.list.map(function (x, ti) {
          var a = self.artFor(x, false);
          var rare = x.own && x.r >= 3;
          return {
            label: x.label || x.n, miss: !x.own, dl: (0.1 + bi * 0.07 + ti * 0.05) + 's',
            cellCls: 'cell r' + x.r + (x.own ? '' : ' miss'),
            frCls: 'fr' + (rare ? ' glow' : '') + (x.own && x.r >= 4 ? ' shn' : ''),
            aria: (x.label ? x.n + ' ' + x.label : x.n) + (x.own ? ', tenho' : ', falta'),
            isImg: a.isImg, isSheet: a.isSheet, isAura: a.isAura, src: a.src, imgCls: a.imgCls, sheetCls: a.sheetCls, auCls: a.auCls,
            pick: function () { self.sfx(x.own && x.r >= 4 ? SND.legendary : SND.tap, 0.55); self.setState({ sel: x.id }); }
          };
        })
      };
    });
    var segs = FILT.map(function (n, i) {
      return { n: n, on: s.filt === i ? 'true' : 'false', cls: s.filt === i ? 'on' : '',
        pick: function () { self.sfx(SND.tap, 0.45); self.setState({ filt: i }); } };
    });

    // ficha
    var it = s.sel ? ITEMS.filter(function (x) { return x.id === s.sel; })[0] : null, f = { n: '' };
    if (it) {
      var fa = this.artFor(it, true);
      var sub = it.era === -2 ? 'Montaria' : it.era < 0 ? 'Forja' : ERAN[it.era];
      if (it.sub2) sub = it.sub2 + ' · ' + sub;
      f = {
        n: it.n, sub: sub, attr: it.attr, how: it.how, go: it.go, goAria: 'Ir para ' + it.goN,
        chip: (it.own ? '' : 'Falta · ') + (it.cat === 'bes' ? (it.boss ? 'Chefe' : 'Inimigo') : RN[it.r]),
        isImg: fa.isImg, isSheet: fa.isSheet, isAura: fa.isAura, src: fa.src, bigImgCls: fa.bigImgCls, bigSheetCls: fa.bigSheetCls, auCls: fa.auCls
      };
    }

    return {
      tap: tap, gems: String(s.gems),
      isAlbum: s.view === 'album', isCat: s.view === 'cat',
      title: s.view === 'album' ? 'Códex das Eras' : cat.n,
      back: function () { self.sfx(SND.tap, 0.5); self.setState({ view: 'album', sel: null }); },

      pct: String(pct), pctW: pct + '%', pctAria: 'Coleção ' + pct + '%', totTxt: ownAll + ' de ' + totAll + ' itens',
      mkX: (nx ? nx.p : 100) + '%',
      nxtReady: ready, nxtWait: !!nx && !ready, nxtP: nx ? nx.p : 100, nxtImg: nx ? nx.img : IMG.chest,
      nxtLeft: need === 1 ? 'falta 1' : 'faltam ' + need,
      nxtAria: nx ? ('Prêmio de ' + nx.p + '%: ' + nx.d + (ready ? '. Pegar' : '. Faltam ' + need + ' itens')) : 'Todos os prêmios pegos',
      claim: function () {
        if (!nx) return;
        var c = Object.assign({}, s.claimed); c[nx.p] = true;
        self.sfx(SND.claim, 0.8); self.setState({ claimed: c }); self.say('Prêmio de ' + nx.p + '%: ' + nx.d);
      },
      peek: function () { self.sfx(SND.tap, 0.5); if (nx) self.say(nx.p + '%: ' + nx.d); },
      cards: cards,

      segs: segs, bands: bands, catOwn: cOwn, catTot: cIts.length, catP: cP, catW: cP + '%',
      noItems: bands.length === 0, emptyTxt: s.filt === 1 ? 'Nenhum ainda. Vá caçar!' : 'Você já tem todos!',

      hasSel: !!it, f: f,
      fCls: 'sheet' + (it ? ' r' + it.r : ''), fStg: 'stg' + (it && !it.own ? ' miss' : ''),
      closeSel: function () { self.setState({ sel: null }); },
      hasToast: !!s.toast, toast: s.toast
    };
  }
}
</script>
</body>
</html>
