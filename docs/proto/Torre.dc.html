<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Nunito,system-ui,sans-serif;color:#f6ecdf}
a{color:#ffc94a}a:hover{color:#ffe08a}
button{font-family:Nunito,system-ui,sans-serif;cursor:pointer}
@keyframes sheet{from{background-position:0 0}to{background-position:100% 0}}
.kidle{background-image:url(/_blob/579019ed03216cec9c8ba3c275bdff17);background-size:1200% 100%;background-repeat:no-repeat;animation:sheet 1s steps(12, jump-none) infinite}
.krun{background-image:url(/_blob/8afa0095963300992a571cfceba1ffe4);background-size:800% 100%;background-repeat:no-repeat;animation:sheet .667s steps(8, jump-none) infinite}
.katk{background-image:url(/_blob/5aefbf9aed07e3825a987748e552e61c);background-size:1700% 100%;background-repeat:no-repeat;animation:sheet .71s steps(17, jump-none) infinite}
.aura13{background-image:url(/_blob/76eb68fb1277fd16b380293b2c5b5c77);background-size:1600% 100%;background-repeat:no-repeat;animation:sheet 1.333s steps(16, jump-none) infinite}
.boss{background-image:url(/_blob/6ab9e2e6c54dbef8618daf37fd11342f);background-size:contain;background-repeat:no-repeat;background-position:50% 100%;animation:ei 1.8s ease-in-out infinite;transform-origin:50% 100%}
@keyframes ei{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.03)}}
/* fantasma: outro jogador, Kael tingido olhando para a esquerda */
.ghost{filter:hue-rotate(190deg) saturate(.7) brightness(1.15) drop-shadow(0 0 8px rgba(120,200,255,.9));opacity:.82}
.ghostIn{animation:ghostIn .7s ease-out both}
@keyframes ghostIn{from{opacity:0;filter:blur(6px)}to{opacity:1;filter:none}}
.ghostDie{animation:ghostDie .7s ease-in both}
@keyframes ghostDie{0%{opacity:1;filter:brightness(1)}30%{filter:brightness(3) saturate(0)}100%{opacity:0;filter:brightness(3) blur(6px);transform:scale(1.2,.8)}}
.lunge{animation:lunge .45s ease-in-out}
@keyframes lunge{0%,100%{transform:none}45%{transform:translateX(-42px)}}
.zapA{animation:zapA .3s linear both}.zapB{animation:zapB .3s linear both}
@keyframes zapA{0%,100%{filter:none}40%{filter:brightness(2.6) saturate(0)}}
@keyframes zapB{0%,100%{filter:none}40%{filter:brightness(2.6) saturate(0)}}
.khitA{animation:khitA .45s linear both}.khitB{animation:khitB .45s linear both}
@keyframes khitA{0%,100%{filter:none}20%{filter:brightness(2.6) saturate(0)}55%{filter:brightness(1.3) sepia(1) saturate(6) hue-rotate(-40deg)}}
@keyframes khitB{0%,100%{filter:none}20%{filter:brightness(2.6) saturate(0)}55%{filter:brightness(1.3) sepia(1) saturate(6) hue-rotate(-40deg)}}
.exitR{animation:exitR .55s ease-in both}
@keyframes exitR{from{transform:none;opacity:1}80%{opacity:1}to{transform:translateX(150px);opacity:0}}
.exitL{animation:exitL .55s ease-in both}
@keyframes exitL{from{transform:none;opacity:1}80%{opacity:1}to{transform:translateX(-120px);opacity:0}}
.enterL{animation:enterL .6s ease-out both}
@keyframes enterL{from{transform:translateX(-110px);opacity:0}25%{opacity:1}to{transform:none;opacity:1}}
.enterR{animation:enterR .6s ease-out both}
@keyframes enterR{from{transform:translateX(150px);opacity:0}25%{opacity:1}to{transform:none;opacity:1}}
.hide{opacity:0}
.flipX{transform:scaleX(-1)}
/* céu e torre */
.cloud{position:absolute;left:0;right:0;background-image:url(/_blob/2325ac84d4473d6f98d442c2f25e8041);background-repeat:repeat-x;animation:drift 120s linear infinite;pointer-events:none}
@keyframes drift{from{background-position-x:0}to{background-position-x:-2400px}}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:twk 2.4s ease-in-out infinite}
@keyframes twk{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.3)}}
.wall{background-color:#3a2c22;background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.35) 0 2px,transparent 2px 22px),repeating-linear-gradient(90deg,rgba(0,0,0,.28) 0 2px,transparent 2px 44px)}
.wallBoss{background-color:#4a2420}
.dim{filter:brightness(.5) saturate(.7)}
.winOn{background:radial-gradient(ellipse at 50% 70%,#fff3c4 0%,#ffc94a 35%,#c8641a 100%);box-shadow:0 0 16px 4px rgba(255,170,60,.7);animation:flick 2.2s ease-in-out infinite}
@keyframes flick{0%,100%{filter:brightness(1)}40%{filter:brightness(1.25)}60%{filter:brightness(.88)}}
.winBoss{background:radial-gradient(ellipse at 50% 70%,#ffd0c4 0%,#ff5a4e 45%,#7a1a12 100%);box-shadow:0 0 16px 4px rgba(255,90,78,.7);animation:flick 1.4s ease-in-out infinite}
.winOff{background:#0e0a07;box-shadow:inset 0 0 6px rgba(0,0,0,.8)}
.ignite{animation:ignite .9s ease-out both}
@keyframes ignite{0%{filter:brightness(0)}40%{filter:brightness(2.4)}100%{filter:brightness(1)}}
.torch{position:absolute;width:12px;height:18px;border-radius:50% 50% 40% 40%;background:radial-gradient(ellipse at 50% 80%,#fff3c4 0%,#ffc94a 40%,rgba(255,90,30,.0) 75%);animation:torch .35s ease-in-out infinite alternate;transform-origin:50% 100%;pointer-events:none}
@keyframes torch{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.85,1.15) rotate(3deg)}}
.slabCur{animation:slabCur 1.3s ease-in-out infinite}
@keyframes slabCur{0%,100%{box-shadow:0 0 6px rgba(255,201,74,.5);background:#8a6a3a}50%{box-shadow:0 0 24px rgba(255,201,74,1);background:#c99a3a}}
.slabNext{animation:slabNext 1.6s ease-in-out infinite}
@keyframes slabNext{0%,100%{box-shadow:0 0 4px rgba(120,200,255,.4)}50%{box-shadow:0 0 18px rgba(120,200,255,.9)}}
.beam{position:absolute;background:linear-gradient(0deg,rgba(255,201,74,.45),rgba(255,201,74,0));animation:beam 1.3s ease-in-out infinite;pointer-events:none}
@keyframes beam{0%,100%{opacity:.5}50%{opacity:1}}
.medal{animation:medal 1.6s ease-in-out infinite}
@keyframes medal{0%,100%{box-shadow:0 0 6px rgba(255,90,78,.5)}50%{box-shadow:0 0 20px rgba(255,90,78,1)}}
.gemP{animation:gemP 1.4s ease-in-out infinite}
@keyframes gemP{0%,100%{transform:scale(1) rotate(-6deg)}50%{transform:scale(1.15) rotate(6deg)}}
.egg{animation:egg 1.8s ease-in-out infinite;transform-origin:50% 90%}
@keyframes egg{0%,70%,100%{transform:rotate(0)}78%{transform:rotate(-10deg)}86%{transform:rotate(10deg)}94%{transform:rotate(-5deg)}}
.ember{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffe9a8;box-shadow:0 0 8px 2px rgba(255,170,60,.9);animation:ember 4s linear infinite;pointer-events:none}
@keyframes ember{0%{transform:translate(0,0) scale(.4);opacity:0}15%{opacity:1}100%{transform:translate(18px,-260px) scale(1);opacity:0}}
.burst{position:absolute;width:8px;height:8px;border-radius:50%;background:#bfe8ff;box-shadow:0 0 10px 3px rgba(120,200,255,.9);pointer-events:none}
.b0{animation:b0 .7s ease-out both}.b1{animation:b1 .7s ease-out both}.b2{animation:b2 .7s ease-out both}.b3{animation:b3 .7s ease-out both}.b4{animation:b4 .7s ease-out both}.b5{animation:b5 .7s ease-out both}
@keyframes b0{to{transform:translate(-50px,-40px);opacity:0}}@keyframes b1{to{transform:translate(50px,-46px);opacity:0}}@keyframes b2{to{transform:translate(-30px,-80px);opacity:0}}
@keyframes b3{to{transform:translate(34px,-84px);opacity:0}}@keyframes b4{to{transform:translate(-64px,0);opacity:0}}@keyframes b5{to{transform:translate(64px,-6px);opacity:0}}
.dmg{position:absolute;font-family:'Lilita One',sans-serif;font-size:22px;color:#fff;animation:dmg 1s ease-out both;pointer-events:none;white-space:nowrap}
@keyframes dmg{0%{opacity:0;transform:translateY(8px) scale(.6)}15%{opacity:1;transform:translateY(0) scale(1.25)}30%{transform:scale(1)}100%{opacity:0;transform:translateY(-44px)}}
.slashFx{position:absolute;width:110px;height:110px;border-radius:50%;border-top:5px solid #fff6c8;border-right:3px solid rgba(255,201,74,.7);animation:slashFx .3s ease-out both;pointer-events:none}
@keyframes slashFx{0%{opacity:1;transform:rotate(-70deg) scale(.5)}100%{opacity:0;transform:rotate(40deg) scale(1.1)}}
.hpf{transition:width .25s ease-out}
/* entrada e UI */
.topIn{animation:topIn .45s ease-out both}
@keyframes topIn{from{transform:translateY(-20px);opacity:0}to{transform:none;opacity:1}}
.rowIn{animation:rowIn .45s ease-out both}
@keyframes rowIn{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.mileNext{animation:mileNext 1.5s ease-in-out infinite}
@keyframes mileNext{0%,100%{box-shadow:0 0 4px rgba(255,201,74,.4)}50%{box-shadow:0 0 18px rgba(255,201,74,1)}}
.pip{transition:background .3s,box-shadow .3s}
.gold{background:linear-gradient(180deg,#ffe07a,#f2a826);color:#2a1403;box-shadow:0 6px 0 #8a4f0c}
.gold:active{transform:translateY(3px);box-shadow:0 3px 0 #8a4f0c}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 6px 0 #8a4f0c,0 0 0 rgba(255,201,74,0)}50%{box-shadow:0 6px 0 #8a4f0c,0 0 26px rgba(255,201,74,.95)}}
.shineBtn{position:relative;overflow:hidden}
.shineBtn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);background-size:300% 100%;animation:shine 2.6s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,40%{background-position:160% 0}100%{background-position:-60% 0}}
.trophy{animation:trophy 2.2s ease-in-out infinite}
@keyframes trophy{0%,100%{filter:drop-shadow(0 0 2px rgba(255,201,74,.5))}50%{filter:drop-shadow(0 0 10px rgba(255,201,74,1)) brightness(1.2)}}
.ban{animation:ban 1.9s ease-out both}
@keyframes ban{0%{transform:scale(2);opacity:0}14%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
.drop{position:absolute;pointer-events:none;z-index:40}
.pop{display:block;animation:popS .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes popS{0%{transform:scale(0) translateY(0)}60%{transform:scale(1.2) translateY(-30px)}100%{transform:scale(1) translateY(-20px)}}
.cspin{display:block;animation:cspin .6s linear infinite}
@keyframes cspin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.15)}}
.bumpA{animation:bumpA .4s ease-out}.bumpB{animation:bumpB .4s ease-out}
@keyframes bumpA{0%{transform:scale(1)}40%{transform:scale(1.18);box-shadow:0 0 16px rgba(255,201,74,.9)}100%{transform:scale(1)}}
@keyframes bumpB{0%{transform:scale(1)}40%{transform:scale(1.18);box-shadow:0 0 16px rgba(255,201,74,.9)}100%{transform:scale(1)}}
.quake{animation:quake .4s}
@keyframes quake{25%{transform:translate(-5px,2px)}50%{transform:translate(5px,-2px)}75%{transform:translate(-3px,1px)}}
.vsBar{transition:width .5s ease-out}
.vip{background:linear-gradient(180deg,#ffe07a,#f2a826);color:#2a1403;border-radius:6px;padding:0 5px;font-size:11px;font-weight:900;line-height:17px}

/* ===== HEADER NOVO (igual Batalha tela cheia V2): voltar à batalha, título no centro, pílulas de moedas e gemas, sem engrenagem ===== */
.nhApp{position:relative;width:100%;height:100vh;height:100dvh;min-height:520px;overflow:hidden;display:flex;flex-direction:column;font-family:Nunito,system-ui,sans-serif;color:#f6ecdf}
.nhGl{background:rgba(16,11,8,.56);-webkit-backdrop-filter:blur(8px) saturate(1.2);backdrop-filter:blur(8px) saturate(1.2);border:1px solid rgba(255,236,200,.16);box-shadow:0 6px 16px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08)}
.nh{position:relative;z-index:20;flex:none;display:flex;align-items:center;gap:8px;min-height:60px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));box-sizing:border-box;background:linear-gradient(180deg,rgba(12,8,6,.92),rgba(12,8,6,.62));border-bottom:1px solid rgba(255,236,200,.12)}
.nhBk{width:44px;height:44px;flex:none;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#f6ecdf;text-decoration:none;box-sizing:border-box;transition:transform .12s}
.nhBk:active{transform:scale(.9)}
.nhT{flex:1;min-width:0;margin:0;text-align:center;font-family:'Lilita One',sans-serif;font-weight:400;font-size:clamp(18px,5.6vw,24px);line-height:1.15;color:#fff;text-shadow:0 2px 0 #120c08,0 0 8px rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nhT .gtext{text-shadow:none}
.nhP{flex:none;display:flex;align-items:center;gap:6px}
.nhB{height:44px;display:flex;align-items:center;padding:0;border:0;background:none;text-decoration:none;color:#f6ecdf}
.nhB:active .nhPill{transform:scale(.94)}
.nhPill{height:38px;display:flex;align-items:center;gap:5px;padding:0 4px;border-radius:999px;color:#f6ecdf;box-sizing:border-box}
.nhPill img{width:24px;height:24px;object-fit:contain}
.nhPill b{font-size:13.5px;font-weight:900}
.nhPlus{width:24px;height:24px;border-radius:50%;background:linear-gradient(180deg,#7fe07a,#3fae3c);color:#0d2410;font-size:17px;font-weight:900;line-height:24px;text-align:center;box-shadow:0 2px 0 #1f6a1d}
@media (max-width:380px){.nhPlus{display:none}.nhPill{padding:0 10px 0 4px}}
/* painel em tela cheia por cima da batalha: o miolo rola em tela baixa, a ação principal fica fixa embaixo (polegar) */
.nhBody{position:relative;flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch}
.nhWrap{width:100%;max-width:640px;margin:0 auto;box-sizing:border-box}
.nhFoot{position:relative;z-index:10;flex:none;width:100%;max-width:640px;margin:0 auto;padding:8px 12px;padding-bottom:max(12px,env(safe-area-inset-bottom));box-sizing:border-box}
/* torre: o desenho aprovado (390 px de largura, quadro de câmera de 446 px) fica centrado; tela alta mostra mais andares, tela baixa ancora o andar atual embaixo */
.twView{position:relative;flex:1 1 auto;min-height:320px;margin:0 -12px;overflow:hidden;border-top:2px solid #4a3a2b;border-bottom:2px solid #4a3a2b;background:#141a30}
.twCam{position:absolute;left:50%;width:390px;height:446px;margin-left:-195px;top:min(calc((100% - 446px) / 2), calc(100% - 446px))}
</style>
</helmet>
<div class="nhApp" id="twApp" style="background: #16110d">

  <!-- HEADER NOVO (igual Batalha tela cheia V2): voltar à batalha · título · moedas e gemas (sem engrenagem; Configurações fica no MENU da batalha) -->
  <div class="nh">
    <a href="BatalhaTelaCheiaV2.dc.html" onClick="{{tap}}" class="nhBk nhGl" aria-label="Voltar para a batalha">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </a>
    <span class="nhT" role="heading" aria-level="1">Torre</span>
    <div class="nhP">
      <a href="Loja.dc.html" onClick="{{tap}}" class="nhB" aria-label="Moedas: 48.200. Comprar na loja"><span class="nhPill nhGl {{coinBump}}" id="nhCoin"><img src="/_blob/3f2502c864add38c4b3faf5853f0dd9a" alt=""><b>48.200</b><span class="nhPlus" aria-hidden="true">+</span></span></a>
      <a href="Loja.dc.html" onClick="{{tap}}" class="nhB" aria-label="Gemas: 320. Comprar na loja"><span class="nhPill nhGl"><img src="/_blob/1c420bdcae24bd962967021584f5bd64" alt="" style="width: 22px; height: 22px"><b>320</b><span class="nhPlus" aria-hidden="true">+</span></span></a>
    </div>
  </div>

  <div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 80%, #3a2810 0%, #1d1611 50%, #16110d 85%)"></div>

  <!-- painel em tela cheia (usa o espaço da antiga barra); rola só em tela baixa -->
  <div class="nhBody"><div class="nhWrap" style="min-height: 100%; display: flex; flex-direction: column; gap: 8px; padding: 6px 12px 4px">

  <!-- tentativas (voltar e título "Torre" estão no header) -->
  <div class="topIn" style="position: relative; flex: none; height: 44px; display: flex; align-items: center; justify-content: center; gap: 10px; animation-delay: .05s">
    <span role="img" aria-label="{{tryAria}}" style="height: 40px; display: flex; align-items: center; gap: 6px; padding: 0 10px; border-radius: 12px; background: #0e0a07; border: 1px solid #4a3a2b">
      <span style="display: flex; flex-direction: column; line-height: 1.05">
        <span style="font-size: 11px; font-weight: 800; color: #c9b9a2">Tentativas</span>
        <span style="font-size: 10px; font-weight: 800; color: #c9b9a2">só a derrota gasta</span>
      </span>
      <sc-for list="{{tries}}" as="t" hint-placeholder-count="5">
        <span class="pip" style="width: 10px; height: 16px; border-radius: 4px; background: {{t.bg}}; box-shadow: {{t.sh}}"></span>
      </sc-for>
      <span style="font-family: 'Lilita One', sans-serif; font-size: 16px">{{tryTxt}}</span>
    </span>
  </div>

  <!-- ===== torre vertical (câmera) ===== -->
  <div class="twView {{viewQuake}}" role="img" aria-label="{{towerAria}}">
    <div class="twCam">
    <!-- céu com parallax lento -->
    <div style="position: absolute; left: 0; right: 0; top: -320px; height: 1100px; background: linear-gradient(180deg, #0c1024 0%, #1b2346 35%, #3a2c4a 62%, #6a3a2e 85%, #3a2418 100%); transform: translateY({{skyY}}); transition: transform {{camDur}} cubic-bezier(.5,0,.3,1)">
      <span class="star" style="left: 24px; top: 360px"></span><span class="star" style="left: 352px; top: 400px; animation-delay: .7s"></span>
      <span class="star" style="left: 40px; top: 520px; animation-delay: 1.3s"></span><span class="star" style="left: 360px; top: 600px; animation-delay: .3s"></span>
      <span class="star" style="left: 18px; top: 700px; animation-delay: 1.8s"></span><span class="star" style="left: 372px; top: 760px; animation-delay: 1s"></span>
      <div class="cloud" style="top: 430px; height: 90px; background-size: auto 90px; opacity: .35"></div>
      <div class="cloud" style="top: 700px; height: 120px; background-size: auto 120px; opacity: .45; animation-duration: 80s"></div>
    </div>

    <!-- torre: andares em coordenadas da torre; a câmera move tudo -->
    <div id="twInner" style="position: absolute; left: 0; top: 0; width: 390px; height: 2200px; transform: translateY({{camY}}); transition: transform {{camDur}} cubic-bezier(.5,0,.3,1)">
      <sc-for list="{{floors}}" as="f" hint-placeholder-count="5">
        <div style="position: absolute; left: 0; top: {{f.top}}; width: 390px; height: 110px">
          <!-- parede -->
          <div class="wall {{f.wallCls}}" style="position: absolute; left: 66px; top: 0; width: 258px; height: 110px; border-left: 4px solid #241a12; border-right: 4px solid #241a12; box-sizing: border-box">
            <sc-if value="{{f.boss}}" hint-placeholder-val="{{false}}">
              <span aria-hidden="true" style="position: absolute; left: 92px; top: 0; width: 22px; height: 46px; background: #a8231a; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%)"></span>
              <span aria-hidden="true" style="position: absolute; left: 136px; top: 0; width: 22px; height: 46px; background: #a8231a; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%)"></span>
            </sc-if>
            <span class="{{f.winCls}}" aria-hidden="true" style="position: absolute; left: 44px; top: 14px; width: 26px; height: 36px; border-radius: 13px 13px 3px 3px"></span>
            <span class="{{f.winCls}}" aria-hidden="true" style="position: absolute; right: 44px; top: 14px; width: 26px; height: 36px; border-radius: 13px 13px 3px 3px; animation-delay: .6s"></span>
            <!-- portas: entra pela esquerda, sai pela direita -->
            <span aria-hidden="true" style="position: absolute; left: 4px; bottom: 12px; width: 30px; height: 62px; border-radius: 15px 15px 0 0; background: #0b0807; border: 3px solid #5a4430; border-bottom: 0; box-sizing: border-box"></span>
            <span aria-hidden="true" style="position: absolute; right: 4px; bottom: 12px; width: 30px; height: 62px; border-radius: 15px 15px 0 0; background: #0b0807; border: 3px solid #5a4430; border-bottom: 0; box-sizing: border-box"></span>
          </div>
          <sc-if value="{{f.lit}}" hint-placeholder-val="{{true}}">
            <span class="torch" style="left: 60px; top: 40px"></span>
            <span class="torch" style="left: 318px; top: 40px; animation-delay: .17s"></span>
          </sc-if>
          <!-- laje (pés em y 98) -->
          <div class="{{f.slabCls}}" style="position: absolute; left: 56px; top: 98px; width: 278px; height: 12px; border-radius: 3px; background: {{f.slabBg}}; border-top: 2px solid {{f.slabTop}}; box-sizing: border-box"></div>

        lit: cleared,
        slabCls: isCur ? 'slabCur' : (isNext ? 'slabNext' : ''),
        slabBg: cleared ? '#7a6248' : '#4a3a2b', slabTop: cleared ? '#b08a5a' : '#5a4836',
        plateBg: isCur ? '#3a2c1f' : '#1d1611', plateBd: isCur ? '#ffc94a' : (boss ? '#ff5a4e' : (isNext ? '#4aa3ff' : '#4a3a2b')),
        plateFg: isCur ? '#ffc94a' : (f > next ? '#8a7a66' : '#f6ecdf'),
        boss: boss, bossImg: f === 20 ? IMG.mino : IMG.dragon, bossF: cleared ? 'grayscale(.6)' : 'none',
        bossAria: 'Chefe do andar ' + f + (f === 20 ? ': Minotauro, vencido' : ': Dragão Real'),
        gem: gemMile && !boss, mileAria: 'Marco do andar ' + f + ': +20 gemas'
      });
    }
    var camY = 250 - topOf(s.cam);
    var miles = MILES.map(function (m) {
      var done = s.best >= m.f, nx = !done && MILES.filter(function (q) { return s.best < q.f; })[0] === m;
      return { f: String(m.f), t: m.t, gem: !!m.gem, egg: !!m.egg, eggC: m.eggC || '#4aa3ff', done: done,
        cls: nx ? 'mileNext' : '', bg: nx ? '#3a2c1f' : '#1d1611', bd: done ? '#5fd068' : (nx ? '#ffc94a' : '#4a3a2b'),
        nc: nx ? '#ffc94a' : '#f6ecdf', tc: done ? '#9ff0a8' : '#e8dccb',
        aria: 'Marco do andar ' + m.f + ': ' + m.t + (done ? ', recebido' : (nx ? ', próximo, faltam ' + (m.f - s.best) + ' andares' : '')) };
    });
    var tries = [];
    for (var i = 0; i < MAXTRY; i++) { var on = i < s.tries; tries.push({ bg: on ? '#ffc94a' : '#33271d', sh: on ? '0 0 6px rgba(255,201,74,.8)' : 'none' }); }
    var strong = ratio >= 1, close = ratio >= 0.85;
    var kTop = topOf(s.kFloor) + 98 - 91;
    var canUp = !s.busy && s.tries > 0;
    return {
      tap: function () { self.sfx(SND.tap, 0.5); },
      coinBump: s.bump ? (s.bump % 2 ? 'bumpA' : 'bumpB') : '',
      tries: tries, tryTxt: s.tries + '/' + MAXTRY, tryAria: 'Tentativas de hoje: ' + s.tries + ' de ' + MAXTRY + '. Só a derrota gasta.',
      towerAria: 'Torre: Kael no andar ' + s.kFloor + '. Próximo: andar ' + next + ', FC ' + fk(nfc) + '.',
      viewQuake: s.quake ? 'quake' : '',
      camY: camY + 'px', skyY: Math.round((camY + 1070) * 0.12) + 'px', camDur: s.camDur,
      floors: floors,
      beamY: (topOf(s.kFloor) + 8) + 'px',
      foeOn: true, foeY: (topOf(s.gFloor) + 98 - 99) + 'px', foeBoss: s.gFloor % 10 === 0, foeGhost: s.gFloor % 10 !== 0, foeWrap: s.foeWrap, foeZap: s.foeZap, foeLunge: s.foeLunge,
      foeAria: (s.gFloor % 10 === 0 ? 'Chefe Dragão Real' : 'Fantasma de outro jogador') + ' no andar ' + s.gFloor + ', FC ' + fk(floorFc(s.gFloor)),
      foeHp: s.foeHp + '%', kHp: s.kHp + '%', hpOp: s.fight ? 1 : 0,
      burstOn: s.burst, burstY: (topOf(s.best) + 50) + 'px',
      kWrap: s.kWrap, kY: kTop + 'px', kFlip: s.kFlip, kHit: s.kHit, kSheet: s.kSheet,
      kAria: s.kSheet === 'katk' ? 'Kael atacando' : (s.kSheet === 'krun' ? 'Kael correndo' : 'Kael de pé no andar ' + s.kFloor),
      slashOn: s.slash, slashY: (topOf(s.kFloor) + 4) + 'px', dmgs: s.dmgs,
      emberY: (topOf(s.kFloor) + 100) + 'px',
      banOn: !!s.ban, banTxt: s.ban ? s.ban.t : '', banSub: s.ban ? s.ban.sub : '', banBg: s.ban ? s.ban.bg : '', banBd: s.ban ? s.ban.bd : '', banSubC: s.ban ? s.ban.subC : '',
      nextLabel: 'Próximo: andar ' + next + (next % 10 === 0 ? ' · chefe' : ''), nextFc: fk(nfc),
      vsW: Math.round(PLAYER_FC / (PLAYER_FC + nfc) * 100) + '%',
      vsBd: strong ? '#5fd068' : (close ? '#ffc94a' : '#ff5a4e'),
      vsTxt: strong ? 'Você vence' : (close ? 'Arriscado' : 'Muito forte'),
      vsChipBg: strong ? '#1f3a22' : (close ? '#3a2c12' : '#3a1612'), vsChipFg: strong ? '#9ff0a8' : (close ? '#ffd27a' : '#ffb0a8'),
      miles: miles,
      rankTxt: 'Andar ' + s.best,
      climb: function () { self.climb(); }, upOff: !canUp,
      upCls: canUp ? 'gold pulse shineBtn' : '', upBg: canUp ? '' : '#2a1f16', upFg: canUp ? '#2a1403' : '#8a7a66',
      upTxt: s.tries > 0 ? (s.busy ? 'Subindo...' : 'Subir') : 'Sem tentativas',
      upSub: s.tries > 0 ? 'Lutar no andar ' + next : 'Renovam à meia-noite',
      drops: s.drops.map(function (d) { return { x: d.x + 'px', y: d.y + 'px', op: d.op, tr: d.tr, dl: d.dl, coin: d.t === 0, stn: d.t === 1 }; })
    };
  }
}
</script>
