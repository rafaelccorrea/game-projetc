@keyframes gScroll{to{transform:translateX(-422px)}}
.cape{transform-box:fill-box;transform-origin:50% 0;animation:cape 1.6s ease-in-out infinite}
@keyframes cape{0%,100%{transform:skewX(0) scaleX(1)}50%{transform:skewX(-7deg) scaleX(1.05)}}
.armGive{transform-box:view-box;transform-origin:72px 80px;animation:armGive 1.6s ease-in-out both}
@keyframes armGive{0%{transform:rotate(0)}30%,70%{transform:rotate(-32deg)}100%{transform:rotate(0)}}
.orbG{animation:orbG 1.8s ease-in-out infinite}
@keyframes orbG{0%,100%{opacity:.7}50%{opacity:1}}
.scarf{position:absolute;animation:scarf 1.2s ease-in-out both;pointer-events:none}
@keyframes scarf{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:1}50%{transform:translate(62px,-54px) rotate(18deg)}90%{opacity:1}100%{transform:translate(124px,-14px) scale(.5) rotate(6deg);opacity:0}}
.scarfWave{transform-box:fill-box;transform-origin:0 50%;animation:waveF .4s ease-in-out infinite}
@keyframes waveF{0%,100%{transform:skewY(0)}50%{transform:skewY(10deg)}}
/* portal do chamado */
.pSlide{animation:pSlide .9s linear both}
@keyframes pSlide{from{transform:translateX(217px)}to{transform:none}}
.pBig{transform-origin:50% 100%;animation:pBig 1.4s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes pBig{from{transform:none}to{transform:scale(1.45)}}
.portal{position:absolute;inset:0;border-radius:50%;animation:pOpen .9s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pOpen{from{transform:scale(0,.2);opacity:0}to{transform:none;opacity:1}}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff3c4;box-shadow:0 0 10px 3px rgba(255,201,74,.9);animation:twinkle 1.4s ease-in-out infinite;pointer-events:none}
@keyframes twinkle{0%,100%{transform:scale(.2);opacity:0}50%{transform:scale(1.2);opacity:1}}
/* ===== câmera, cortes, clarões, tremor ===== */
.flash{animation:flash .9s ease-out both;pointer-events:none}
@keyframes flash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
.cut{animation:cut .9s ease-out both;pointer-events:none}
@keyframes cut{0%{opacity:1}100%{opacity:0}}
.quake{animation:quake .5s}
@keyframes quake{20%{transform:translate(-7px,3px)}40%{transform:translate(7px,-3px)}60%{transform:translate(-5px,2px)}80%{transform:translate(3px,-1px)}}
.quakeB{animation:quakeB .8s}
@keyframes quakeB{10%{transform:translate(-12px,6px) rotate(-.6deg)}25%{transform:translate(11px,-6px) rotate(.6deg)}40%{transform:translate(-9px,4px)}55%{transform:translate(8px,-3px)}70%{transform:translate(-5px,2px)}85%{transform:translate(3px,-1px)}}
/* ===== legenda, título, botões ===== */
.capIn{animation:capIn .4s ease-out both}
@keyframes capIn{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.caret{display:inline-block;width:2px;height:16px;margin-left:2px;vertical-align:-2px;background:#ffc94a;animation:caret .7s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.dot{transition:width .3s,background .3s}
.title{display:inline-block;animation:title .9s cubic-bezier(.2,1.5,.4,1) both,glowT 2.2s .9s ease-in-out infinite}
@keyframes title{0%{transform:scale(2.6);opacity:0;letter-spacing:14px}100%{transform:none;opacity:1;letter-spacing:2px}}
@keyframes glowT{0%,100%{filter:drop-shadow(0 4px 0 #6a3a08) drop-shadow(0 0 8px rgba(255,201,74,.45))}50%{filter:drop-shadow(0 4px 0 #6a3a08) drop-shadow(0 0 26px rgba(255,201,74,1))}}
.titleFill{background:linear-gradient(100deg,#ffd35a 0%,#ffe9a6 40%,#ffffff 48%,#ffe9a6 56%,#f2a826 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:tShine 3s ease-in-out infinite}
@keyframes tShine{0%,30%{background-position:100% 0}100%{background-position:-60% 0}}
.fadeUp{animation:fadeUp .6s ease-out both}
@keyframes fadeUp{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.gold{background:linear-gradient(180deg,#ffe07a,#f2a826);color:#2a1403;box-shadow:0 6px 0 #8a4f0c;border:2px solid #fff0b0}
.gold:active{transform:translateY(3px);box-shadow:0 3px 0 #8a4f0c}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 6px 0 #8a4f0c,0 0 0 rgba(255,201,74,0)}50%{box-shadow:0 6px 0 #8a4f0c,0 0 28px rgba(255,201,74,.95)}}
.shineBtn{position:relative;overflow:hidden}
.shineBtn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);background-size:300% 100%;animation:shine 2.6s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,40%{background-position:160% 0}100%{background-position:-60% 0}}
.ghostBtn{background:#33271d;color:#f6ecdf;border:2px solid #6a5a4a;box-shadow:0 4px 0 #120d09}
</style>
</helmet>
<div class="{{quakeCls}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #050818; font-family: Nunito, system-ui, sans-serif; color: #f6ecdf">

  <!-- ===== CÉU NOTURNO ===== -->
  <div style="position: absolute; inset: 0; background: linear-gradient(180deg, #03050f 0%, #0a1030 30%, #1a2058 58%, #3a3570 78%, #4a3a68 100%)"></div>
  <div class="tint" style="opacity: {{tStorm}}; background: linear-gradient(180deg, #12031c 0%, #3a0b3e 45%, #6a1a3a 75%, #3a1028 100%)"></div>
  <div class="cam" style="transform: {{starT}}; transition: transform {{camD}} cubic-bezier(.5,0,.2,1)">
    <sc-for list="{{stars}}" as="t" hint-placeholder-count="12">
      <span class="star" style="left: {{t.x}}; top: {{t.y}}; width: {{t.s}}; height: {{t.s}}; animation-delay: {{t.d}}"></span>
    </sc-for>
    <sc-if value="{{showShoot}}" hint-placeholder-val="{{true}}">
      <span class="shoot"></span>
    </sc-if>
  </div>

  <!-- ===== RELÓGIO DAS ERAS (arte) — câmera própria ===== -->
  <div class="cam" style="transform: {{clkT}}; transform-origin: 195px 250px; transition: transform {{camD}} cubic-bezier(.5,0,.2,1)">
    <sc-if value="{{showWhole}}" hint-placeholder-val="{{true}}">
      <div class="rays" style="left: -55px; top: -50px; width: 500px; height: 500px"></div>
      <div class="raysB" style="left: 5px; top: 10px; width: 380px; height: 380px"></div>
      <div class="cGlow" style="left: 25px; top: 80px; width: 340px; height: 340px"></div>
      <div class="{{shakeCls}}" style="position: absolute; left: 45px; top: 100px; width: 300px; height: 300px">
        <div class="clkPulse" style="position: absolute; inset: 0">
          <div class="imgWhole clkSpin" role="img" aria-label="O Relógio das Eras inteiro, girando devagar no céu" style="position: absolute; inset: 0"></div>
        </div>
      </div>
      <div class="orbit" style="left: 15px; top: 70px; width: 360px; height: 360px">
        <span class="orbS" style="left: 177px; top: -3px"></span><span class="orbS" style="left: 357px; top: 177px"></span>
        <span class="orbS" style="left: 177px; top: 357px"></span><span class="orbS" style="left: -3px; top: 177px"></span>
      </div>
    </sc-if>
    <sc-if value="{{showEmpty}}" hint-placeholder-val="{{false}}">
      <div class="raysP" style="left: -35px; top: -30px; width: 460px; height: 460px"></div>
      <div class="cGlowP" style="left: 35px; top: 90px; width: 320px; height: 320px"></div>
      <div class="emptyIn" style="position: absolute; left: 55px; top: 110px; width: 280px; height: 280px">
        <div class="imgEmpty clkSpinE" role="img" aria-label="O Relógio das Eras rachado, com os nove encaixes vazios" style="position: absolute; inset: 0"></div>
      </div>
    </sc-if>
  </div>

  <!-- céu rachado -->
  <sc-if value="{{showCrack}}" hint-placeholder-val="{{false}}">
    <svg width="390" height="320" viewBox="0 0 390 320" aria-hidden="true" style="position: absolute; left: 0; top: 30px; pointer-events: none">
      <path class="crack" d="M0 70 L40 92 L72 74 L110 118 L150 98 L196 150 L232 126 L262 170 L300 140 L340 186 L390 160" fill="none" stroke="#e8d4ff" stroke-width="4" stroke-linejoin="round" style="filter: drop-shadow(0 0 8px #b07cff)"></path>
      <path class="crack" d="M150 98 L160 50 L186 30 M262 170 L282 230 L270 280" fill="none" stroke="#d9b3ff" stroke-width="2.5" stroke-linejoin="round" style="filter: drop-shadow(0 0 6px #b07cff); animation-delay: .3s, 1.2s"></path>
    </svg>
  </sc-if>

  <!-- ===== DEVORADOR DE ERAS (sombra viva) ===== -->
  <sc-if value="{{showDevo}}" hint-placeholder-val="{{false}}">
    <div class="{{devoCls}}" role="img" aria-label="O Devorador de Eras, uma sombra com muitos olhos, avança sobre o Relógio" style="position: absolute; left: 196px; top: 26px; width: 210px; height: 180px">
      <div class="devoDrift">
        <span class="tendr td1" style="left: 150px; top: 40px; width: 90px"></span>
        <span class="tendr td2" style="left: 150px; top: 120px; width: 80px; animation-delay: .7s"></span>
        <span class="tendr td3" style="left: 100px; top: 10px; width: 70px; animation-delay: 1.2s"></span>
        <span class="blob" style="left: 20px; top: 30px; width: 150px; height: 140px"></span>
        <span class="blob" style="left: 70px; top: 0; width: 120px; height: 120px; animation-delay: .5s"></span>
        <span class="blob" style="left: 0; top: 80px; width: 110px; height: 100px; animation-delay: 1s"></span>
        <span class="blob" style="left: 110px; top: 70px; width: 100px; height: 100px; animation-delay: 1.5s"></span>
        <span class="dEye" style="left: 62px; top: 66px; width: 18px; height: 12px; background: #ff3a2e; box-shadow: 0 0 12px 4px rgba(255,60,40,.9)"></span>
        <span class="dEye" style="left: 96px; top: 56px; width: 22px; height: 14px; background: #ff5a4e; box-shadow: 0 0 14px 5px rgba(255,60,40,.95); animation-delay: .3s"></span>
        <span class="dEye" style="left: 130px; top: 70px; width: 14px; height: 10px; background: #ffc94a; box-shadow: 0 0 10px 4px rgba(255,180,40,.9); animation-delay: .9s"></span>
        <span class="dEye" style="left: 82px; top: 92px; width: 12px; height: 8px; background: #ffc94a; box-shadow: 0 0 10px 3px rgba(255,180,40,.9); animation-delay: 1.4s"></span>
        <span class="dEye" style="left: 118px; top: 100px; width: 16px; height: 10px; background: #ff3a2e; box-shadow: 0 0 12px 4px rgba(255,60,40,.9); animation-delay: 2s"></span>
        <span class="dEye" style="left: 44px; top: 104px; width: 10px; height: 7px; background: #ff8a7a; box-shadow: 0 0 8px 3px rgba(255,90,70,.9); animation-delay: 2.4s"></span>
        <sc-for list="{{dParts}}" as="p" hint-placeholder-count="6">
          <span class="dPart {{p.cls}}" style="left: {{p.x}}; top: {{p.y}}; animation-delay: {{p.d}}"></span>
        </sc-for>
        <span class="dSmoke" style="left: 140px; top: 120px"></span>
        <span class="dSmoke" style="left: 30px; top: 140px; animation-delay: 1s"></span>
        <span class="dSmoke" style="left: 160px; top: 30px; animation-delay: 2s"></span>
      </div>
    </div>
  </sc-if>

  <!-- ===== VILA DO VALE (cenário aprovado) — câmera ===== -->
  <div class="cam {{runCls}}" style="transform: {{vilT}}; transform-origin: 42% 78%; transition: transform {{camD}} cubic-bezier(.5,0,.2,1), filter 1.2s ease; filter: {{vilF}}">
    <div class="ly Lcld e2cld cldDrift" style="opacity: .55"></div>
    <div class="ly Lfar e2far"></div>
    <sc-if value="{{showMon}}" hint-placeholder-val="{{false}}">
      <div class="mon mDrag" role="img" aria-label="Silhueta de dragão no horizonte" style="position: absolute; left: 14px; top: 440px; width: 120px; height: 116px"></div>
      <div class="mon mMino" role="img" aria-label="Silhueta de minotauro no horizonte" style="position: absolute; left: 150px; top: 452px; width: 96px; height: 104px; animation-delay: .3s, 1.5s"></div>
      <div class="mon mDevo" role="img" aria-label="Silhueta de robô no horizonte" style="position: absolute; left: 266px; top: 446px; width: 108px; height: 110px; animation-delay: .6s, 1.8s"></div>
    </sc-if>
    <div class="ly Lmid e2mid"></div><div class="ly Lgnd e2gnd"></div>
  </div>

  <!-- ===== PERSONAGENS (mesma câmera da vila, sem escurecer tanto) ===== -->
  <div class="cam" style="transform: {{vilT}}; transform-origin: 42% 78%; transition: transform {{camD}} cubic-bezier(.5,0,.2,1)">
    <!-- raio de luz do relógio sobre a vila -->
    <sc-if value="{{showBeam}}" hint-placeholder-val="{{true}}">
      <div class="beam" style="left: 110px; top: 160px; width: 170px; height: 520px"></div>
    </sc-if>
    <sc-if value="{{showFly}}" hint-placeholder-val="{{true}}">
      <span class="fly" style="left: 40px; top: 470px"></span><span class="fly" style="left: 300px; top: 430px; animation-delay: 1.2s"></span>
      <span class="fly" style="left: 200px; top: 500px; animation-delay: 2.4s"></span><span class="fly" style="left: 350px; top: 520px; animation-delay: 3.3s"></span>
      <span class="fly" style="left: 90px; top: 560px; animation-delay: 1.8s"></span><span class="fly" style="left: 260px; top: 590px; animation-delay: .6s"></span>
    </sc-if>

    <!-- portal do chamado (pés na linha do chão, y 660) -->
    <sc-if value="{{showPortal}}" hint-placeholder-val="{{false}}">
      <div class="{{pWrapCls}}" style="position: absolute; left: {{pX}}; top: 424px; width: 110px; height: 236px">
        <div class="portal" aria-hidden="true" style="box-shadow: 0 0 60px 20px rgba(255,201,74,0.55)">
          <div class="pSwirl"></div><div class="pCore"></div>
        </div>
        <span class="spark" style="left: 6px; top: 20px"></span>
        <span class="spark" style="left: 98px; top: 80px; animation-delay: .4s"></span>
        <span class="spark" style="left: 14px; top: 190px; animation-delay: .8s"></span>
        <span class="spark" style="left: 90px; top: 200px; animation-delay: 1.1s"></span>
      </div>
    </sc-if>

    <!-- avô (silhueta com capa, provisória) — pés em y 658 -->
    <sc-if value="{{showGpa}}" hint-placeholder-val="{{false}}">
      <div class="{{gWrapCls}}" style="position: absolute; left: 14px; top: 468px; width: 120px; height: 200px">
        <div style="position: absolute; left: 14px; top: 182px; width: 96px; height: 14px; border-radius: 50%; background: rgba(0,0,0,0.45)"></div>
        <div class="gpa" style="width: 120px; height: 190px">
          <svg width="120" height="190" viewBox="0 0 120 190" role="img" aria-label="O avô, o antigo Guardião, de capa e cajado (silhueta provisória)" style="filter: drop-shadow(0 0 5px rgba(255,201,74,0.5))">

            <circle class="orbG" cx="20" cy="32" r="8" fill="#ffd36a" style="filter: drop-shadow(0 0 8px #ffc94a)"></circle>
            <path class="cape" d="M44 62 Q30 110 14 186 L66 188 Q58 120 60 66 Z" fill="#1c0d18" stroke="#6a2a3a" stroke-width="2"></path>
            <path d="M42 70 Q60 54 82 70 L94 188 L34 188 Z" fill="#141019" stroke="#5a4a6a" stroke-width="2" stroke-linejoin="round"></path>
            <path d="M44 66 Q46 30 64 28 Q82 30 84 66 Q74 56 64 56 Q54 56 44 66 Z" fill="#1c0d18" stroke="#6a2a3a" stroke-width="2"></path>
            <circle cx="66" cy="48" r="12" fill="#2a2030"></circle>
            <path d="M56 54 Q58 80 66 86 Q74 80 78 54 Q68 60 56 54 Z" fill="#d8d0c4"></path>
            <circle cx="72" cy="45" r="1.8" fill="#ffd36a"></circle>
            <path d="M44 78 L24 98" stroke="#141019" stroke-width="11" stroke-linecap="round"></path>
            <g class="{{armCls}}"><path d="M72 80 L98 100" stroke="#141019" stroke-width="11" stroke-linecap="round"></path><circle cx="100" cy="101" r="5.5" fill="#c9a88a"></circle></g>
            <ellipse cx="50" cy="189" rx="9" ry="3" fill="#0a070c"></ellipse><ellipse cx="78" cy="189" rx="9" ry="3" fill="#0a070c"></ellipse>
          </svg>
        </div>
      </div>
    </sc-if>
    <!-- cachecol voando da mão do avô até o Kael -->
    <sc-if value="{{showScarf}}" hint-placeholder-val="{{false}}">
      <div class="scarf" style="left: 100px; top: 556px; width: 56px; height: 26px">
        <svg width="56" height="26" viewBox="0 0 56 26" role="img" aria-label="O cachecol vermelho do Guardião" style="filter: drop-shadow(0 0 8px rgba(255,90,78,0.95))"><path class="scarfWave" d="M2 8 Q14 2 28 8 Q42 14 54 6 L54 16 Q42 24 28 18 Q14 12 2 18 Z" fill="#e0342a" stroke="#7a1410" stroke-width="1.5"></path></svg>

    <!-- Kael (pés em 95% do quadro = y 658) -->
    <sc-if value="{{showKael}}" hint-placeholder-val="{{true}}">
      <div style="position: absolute; left: {{kShX}}; top: 650px; width: 110px; height: 14px; border-radius: 50%; background: rgba(0,0,0,0.45); opacity: {{kShOp}}; transition: opacity .3s"></div>
      <div class="{{kWrapCls}}" style="position: absolute; left: {{kX}}; top: 491px; width: 176px; height: 176px">
        <div class="{{kCls}} kRim" role="img" aria-label="{{kAria}}" style="width: 176px; height: 176px"></div>
      </div>
    </sc-if>
  </div>

  <!-- ===== A QUEBRA: 9 pedaços (arte) voam girando e caem em portais ===== -->
  <sc-if value="{{showShards}}" hint-placeholder-val="{{false}}">

  <!-- ===== O MAPA: pan de baixo para cima pela arte ===== -->
  <sc-if value="{{showMap}}" hint-placeholder-val="{{false}}">
    <div class="mapIn" style="position: absolute; inset: 0; background: #0d0a08; overflow: hidden; z-index: 5">

        <div class="cloudA drift" style="position: absolute; left: 0; width: 600px; top: 860px; height: 80px; opacity: .45; pointer-events: none"></div>
        <div class="cloudA drift" style="position: absolute; left: 0; width: 600px; top: 520px; height: 70px; opacity: .4; pointer-events: none; animation-duration: 80s; animation-direction: reverse"></div>
        <div class="cloudA drift" style="position: absolute; left: 0; width: 600px; top: 170px; height: 70px; opacity: .4; pointer-events: none; animation-duration: 45s"></div>
        <sc-for list="{{motes}}" as="o" hint-placeholder-count="6">
          <span class="mote" style="left: {{o.x}}; top: {{o.y}}; animation-delay: {{o.d}}"></span>
        </sc-for>
        <sc-for list="{{pts}}" as="k" hint-placeholder-count="9">
          <div style="position: absolute; left: {{k.x}}; top: {{k.y}}; width: 0; height: 0">
            <span class="lBeam" style="left: -22px; top: -210px; background: linear-gradient(0deg, {{k.c}}, rgba(255,255,255,0)); animation-delay: {{k.t}}"></span>
            <span class="lGlow" style="left: -34px; top: -14px; width: 68px; height: 28px; background: radial-gradient(ellipse, {{k.c}} 0%, rgba(255,220,140,0.35) 45%, transparent 72%); animation-delay: {{k.t}}, {{k.t}}"></span>
            <span class="ringP" style="left: -30px; top: -11px; width: 60px; height: 22px; border: 3px solid {{k.c}}; animation-delay: {{k.t}}"></span>
            <span class="ringP" style="left: -30px; top: -11px; width: 60px; height: 22px; border: 3px solid {{k.c}}; animation-delay: {{k.t2}}"></span>
            <span class="landT" style="left: -9px; top: -30px; width: 18px; height: 18px; background: radial-gradient(circle, #fff, {{k.c}} 45%, transparent 72%); animation-delay: {{k.tr1}}"></span>
            <span class="landT" style="left: -7px; top: -28px; width: 14px; height: 14px; background: radial-gradient(circle, #fff, {{k.c}} 45%, transparent 72%); animation-delay: {{k.tr2}}"></span>
            <span class="land" role="img" aria-label="{{k.aria}}" style="left: -17px; top: -44px; width: 34px; height: 42px; animation-delay: {{k.tf}}"><span class="sh {{k.cls}} shOn"></span></span>
          </div>
          <div class="plate plateIn" style="position: absolute; left: {{k.lx}}; top: {{k.ly}}; width: 124px; height: 36px; border-radius: 10px; border-color: {{k.c}}; padding: 2px 8px; display: flex; flex-direction: column; justify-content: center; line-height: 1.05; pointer-events: none; animation-delay: {{k.t}}">
            <span style="font-size: 10px; font-weight: 900; color: {{k.c}}; letter-spacing: .6px" class="tOutS">ERA {{k.n}}</span>
