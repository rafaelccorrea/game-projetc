<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Eonbound — Tela de título V2</title>
<!-- TELA DE TÍTULO V2 (substitui Main.dc.html). Logo EONBOUND refeito em código, por cima do Relógio das Eras (arte aprovada) girando.
     3 variações do logo para o dono escolher (faixa PROTÓTIPO no topo): A dourado clássico, B cristal azul futurista, C pedra rúnica antiga.
     Cenário: vila da era 2 em camadas (kit aprovado), parallax quando o Kael corre; "Kael parado" deixa só as nuvens. Sem barra de baixo.
     JOGAR = jogador novo (Prólogo). "Continuar como" = quem volta (abre o Bem-vindo de volta). -->
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Nunito,system-ui,sans-serif;color:#f6ecdf;background:#0b0806}
*{box-sizing:border-box}
a{color:#ffc94a}
button{font-family:Nunito,system-ui,sans-serif;cursor:pointer;color:#f6ecdf}
.lil{font-family:'Lilita One',sans-serif}
.app{position:relative;width:100%;height:100vh;height:100dvh;min-height:560px;overflow:hidden;background:#0b0806;display:flex;flex-direction:column}
@keyframes sheet{from{background-position:0 0}to{background-position:100% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes gsh{from{background-position:120% 0}to{background-position:-130% 0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* faixa do protótipo (fora do jogo) */
.strip{flex:none;display:flex;gap:5px;align-items:center;padding:4px 6px;background:#16110d;border-bottom:1px solid #2a2018}
.vb{flex:1;min-width:0;min-height:44px;border-radius:12px;border:2px dashed #6a5a46;background:#1d1611;color:#c9b9a2;font-size:11px;font-weight:900;line-height:1.1;padding:0 3px}
.vb b{display:block;font-family:'Lilita One',sans-serif;font-weight:400;font-size:15px}
.vb[aria-pressed="true"]{border-style:solid;border-color:#ffc94a;background:#3a2c1f;color:#ffe07a}
/* jogo */
.game{position:relative;flex:1;min-height:0;overflow:hidden;background:#7fb3d9}
/* cenário (cena 844 ancorada embaixo, pés em 658 = 186 px acima da base) */
.scene{position:absolute;left:0;right:0;bottom:0;height:844px}
.ly{position:absolute;left:0;right:0;background-repeat:repeat-x;pointer-events:none}
.Lsky{top:0;height:506px;background-image:url(/_blob/76d16952e1067c864246744b4de14ec2);background-size:auto 506px}
.Lcld{top:40px;height:220px;background-image:url(/_blob/2325ac84d4473d6f98d442c2f25e8041);background-size:auto 220px;animation:pCld 300s linear infinite}
.Lfar{top:186px;height:354px;background-image:url(/_blob/b560db0d0fbc53ee2808f8e477d1d431);background-size:auto 354px}
.Lmid{top:148px;height:422px;background-image:url(/_blob/ebc43f044a58cac3143a4fcbbaad4ef3);background-size:auto 422px}
.Lgnd{top:553px;height:321px;background-image:url(/_blob/37aa087099d000ccdf18a4e875a5ba0d);background-size:auto 321px;background-color:#5a4426}
.run .Lcld{animation:pCld 200s linear infinite}.run .Lfar{animation:pFar 300s linear infinite}.run .Lmid{animation:pMid 300s linear infinite}.run .Lgnd{animation:pGnd 300s linear infinite}
@keyframes pCld{to{background-position-x:-4200px}}
@keyframes pFar{to{background-position-x:-5061px}}
@keyframes pMid{to{background-position-x:-27474px}}
@keyframes pGnd{to{background-position-x:-72300px}}
.tint{position:absolute;inset:0;pointer-events:none;transition:opacity 1s ease}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 6px #9fe8ff;animation:twk 2.2s ease-in-out infinite;pointer-events:none}
@keyframes twk{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.3)}}
.fog{position:absolute;height:60px;border-radius:60px;background:rgba(210,225,205,.32);filter:blur(10px);animation:fog linear infinite;pointer-events:none}
@keyframes fog{from{transform:translateX(-200px)}to{transform:translateX(560px)}}
.beam{position:absolute;top:-10%;width:90px;height:90%;background:linear-gradient(180deg,rgba(255,220,150,.38),rgba(255,220,150,0));transform-origin:50% 0;animation:beam 6s ease-in-out infinite;pointer-events:none;mix-blend-mode:screen}
@keyframes beam{0%,100%{transform:rotate(-14deg);opacity:.5}50%{transform:rotate(-8deg);opacity:1}}
/* Kael (folhas aprovadas, pés em 95% do quadro, na linha da estrada) */
.kRun{background-image:url(/_blob/8afa0095963300992a571cfceba1ffe4);background-size:800% 100%;background-repeat:no-repeat;animation:sheet .667s steps(8, jump-none) infinite}
.kIdle{background-image:url(/_blob/579019ed03216cec9c8ba3c275bdff17);background-size:1200% 100%;background-repeat:no-repeat;animation:sheet 1s steps(12, jump-none) infinite}
.kael{position:absolute;--ks:clamp(150px,24vh,204px);width:var(--ks);height:var(--ks);left:calc(50% - var(--ks) / 2);bottom:calc(186px - var(--ks) * .05);z-index:3}
.kShadow{position:absolute;left:50%;bottom:180px;width:120px;height:14px;margin-left:-60px;border-radius:50%;background:rgba(0,0,0,.4);z-index:2}
.dust{position:absolute;bottom:186px;width:10px;height:10px;border-radius:50%;background:rgba(220,190,140,.7);filter:blur(1px);animation:dust .7s ease-out infinite;z-index:2;opacity:0}
@keyframes dust{0%{transform:translate(0,0) scale(.4);opacity:.8}100%{transform:translate(-46px,-14px) scale(1.8);opacity:0}}
/* ===== bloco do logo ===== */
.logoWrap{position:absolute;left:0;right:0;top:clamp(54px,8vh,74px);display:flex;flex-direction:column;align-items:center;z-index:5;pointer-events:none}
.clockBox{position:relative;width:clamp(220px,34vh,300px);aspect-ratio:1/1;margin-bottom:calc(clamp(220px,34vh,300px) * -.62)}
.imgWhole{background-image:url(/_blob/b0b93955fa1bfd4f947a906a35e9cecb);background-size:contain;background-repeat:no-repeat;background-position:center}
.clk{position:absolute;inset:0;animation:spin 90s linear infinite,clkIn 1.2s cubic-bezier(.2,1.2,.4,1) both}
@keyframes clkIn{from{opacity:0;transform:scale(.6) rotate(-60deg)}to{opacity:1;transform:none}}
.rays{position:absolute;inset:-22%;border-radius:50%;pointer-events:none;-webkit-mask:radial-gradient(circle,#000 22%,transparent 70%);mask:radial-gradient(circle,#000 22%,transparent 70%);animation:spin 50s linear infinite}
.glow{position:absolute;inset:-6%;border-radius:50%;animation:cg 2.8s ease-in-out infinite;pointer-events:none}
@keyframes cg{0%,100%{transform:scale(.92);opacity:.65}50%{transform:scale(1.08);opacity:1}}
.word{position:relative;display:flex;justify-content:center;font-family:'Lilita One',sans-serif;font-size:clamp(50px,15.6vw,68px);line-height:1;letter-spacing:1px;font-kerning:none;white-space:nowrap}
.ltr{display:inline-block;color:transparent;-webkit-background-clip:text;background-clip:text;animation:lIn .7s cubic-bezier(.2,1.5,.4,1) both;animation-delay:var(--d)}
@keyframes lIn{0%{opacity:0;transform:translateY(-60px) scale(1.6) rotate(-10deg)}100%{opacity:1;transform:none}}
.sweep{position:absolute;inset:0;display:flex;justify-content:center;color:transparent;-webkit-background-clip:text;background-clip:text;background-size:300% 100%;animation:sweep 3.6s ease-in-out infinite;pointer-events:none;font-kerning:none;letter-spacing:1px}
@keyframes sweep{0%,35%{background-position:130% 0}100%{background-position:-60% 0}}
.tag{margin-top:8px;animation:tagIn .6s 1s cubic-bezier(.2,1.4,.4,1) both}
@keyframes tagIn{from{opacity:0;transform:scaleX(.2)}to{opacity:1;transform:none}}
.spk{position:absolute;border-radius:50%;pointer-events:none;animation:spk 2.4s ease-in-out infinite;animation-delay:var(--d)}
@keyframes spk{0%,100%{transform:scale(.1);opacity:0}50%{transform:scale(1.2);opacity:1}}
.rise{position:absolute;bottom:-10px;border-radius:50%;pointer-events:none;animation:rise linear infinite;opacity:0}
@keyframes rise{0%{transform:translate(0,0) scale(1);opacity:0}10%{opacity:1}100%{transform:translate(30px,-110vh) scale(.3);opacity:0}}

/* --- A: dourado clássico --- */
.vA .ltr{background-image:linear-gradient(180deg,#fff8d2 0%,#ffe07a 28%,#f2a826 52%,#a85a0a 64%,#ffcf4a 80%,#fff2b8 100%);-webkit-text-stroke:2.5px #3a1a04;filter:drop-shadow(0 3px 0 #8a4f0c) drop-shadow(0 6px 0 #4a2406) drop-shadow(0 10px 14px rgba(0,0,0,.65))}
.vA .sweep{background-image:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.95) 50%,transparent 58%)}
.vA .rays{background:repeating-conic-gradient(from 0deg,rgba(255,226,140,.5) 0deg 6deg,transparent 6deg 20deg)}
.vA .glow{background:radial-gradient(circle,rgba(255,214,120,.7),rgba(255,150,40,.2) 50%,transparent 70%)}
.vA .clk{filter:drop-shadow(0 0 16px rgba(255,201,74,.75))}
.swordBar{position:absolute;left:50%;top:50%;width:112%;height:14px;transform:translate(-50%,-50%);z-index:-1}
.ribbon{position:relative;height:30px;padding:0 26px;display:flex;align-items:center;background:linear-gradient(180deg,#e0453a,#a3201a);color:#fff3d8;font-weight:900;font-size:13px;letter-spacing:3px;text-shadow:0 2px 0 #5a0c08;box-shadow:0 4px 0 #5a0c08,0 6px 12px rgba(0,0,0,.5);-webkit-clip-path:polygon(0 0,100% 0,94% 50%,100% 100%,0 100%,6% 50%);clip-path:polygon(0 0,100% 0,94% 50%,100% 100%,0 100%,6% 50%);overflow:hidden}
.ribbon::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.4) 50%,transparent 60%);background-size:300% 100%;animation:sweep 3.6s .4s ease-in-out infinite}
/* --- B: cristal azul futurista --- */
.vB .ltr{background-image:linear-gradient(180deg,#ffffff 0%,#d2f8ff 30%,#4ad8ff 52%,#1a5fd0 68%,#7fe8ff 86%,#e8fdff 100%);-webkit-text-stroke:1.5px #08224d;filter:drop-shadow(0 0 6px rgba(74,216,255,.9)) drop-shadow(0 0 18px rgba(60,140,255,.7)) drop-shadow(0 6px 10px rgba(0,0,0,.6))}
.vB .ltr:nth-child(3){animation:lIn .7s cubic-bezier(.2,1.5,.4,1) both,glitch 3.2s 1.4s steps(1) infinite;animation-delay:var(--d),1.4s}
@keyframes glitch{0%,90%,100%{transform:none;opacity:1}92%{transform:translate(3px,-2px) skewX(-12deg);opacity:.6}94%{transform:translate(-3px,1px);opacity:1}96%{transform:translate(2px,0) skewX(8deg);opacity:.7}}
.vB .sweep{background-image:repeating-linear-gradient(120deg,transparent 0 14px,rgba(255,255,255,.55) 14px 16px,transparent 16px 34px);background-size:200% 100%;animation:facet 4s linear infinite}
@keyframes facet{from{background-position:0 0}to{background-position:-200% 0}}
.scan{position:absolute;left:-6%;right:-6%;height:6px;top:0;background:linear-gradient(180deg,transparent,rgba(159,232,255,.9),transparent);mix-blend-mode:screen;animation:scan 2.6s ease-in-out infinite;pointer-events:none}
@keyframes scan{0%{transform:translateY(-10px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(74px);opacity:0}}
.vB .rays{background:repeating-conic-gradient(from 10deg,rgba(140,220,255,.4) 0deg 3deg,transparent 3deg 15deg);animation-direction:reverse}
.vB .glow{background:radial-gradient(circle,rgba(150,225,255,.75),rgba(80,150,255,.25) 50%,transparent 70%)}
.vB .clk{filter:drop-shadow(0 0 18px rgba(74,216,255,.9)) saturate(.7) brightness(1.15)}
.ring{position:absolute;inset:-4%;animation:spin 16s linear infinite;pointer-events:none}
.ring2{inset:6%;animation:spin 11s linear infinite reverse}
.techTag{display:flex;align-items:center;gap:8px;color:#bff4ff;font-weight:900;font-size:13px;letter-spacing:5px;text-shadow:0 0 8px rgba(74,216,255,.9)}
.techTag i{display:block;width:44px;height:2px;background:linear-gradient(90deg,transparent,#4ad8ff);box-shadow:0 0 6px #4ad8ff}
.techTag i+span+i{background:linear-gradient(90deg,#4ad8ff,transparent)}
.shard{position:absolute;width:10px;height:14px;background:linear-gradient(180deg,#e8fdff,#4ad8ff);-webkit-clip-path:polygon(50% 0,100% 40%,50% 100%,0 40%);clip-path:polygon(50% 0,100% 40%,50% 100%,0 40%);filter:drop-shadow(0 0 6px #4ad8ff);animation:shard 4s ease-in-out infinite;animation-delay:var(--d);pointer-events:none}
@keyframes shard{0%,100%{transform:translate(0,0) rotate(0);opacity:.3}50%{transform:translate(6px,-14px) rotate(180deg);opacity:1}}
/* --- C: pedra rúnica antiga --- */
.vC .ltr{background-image:repeating-linear-gradient(35deg,rgba(0,0,0,.12) 0 2px,transparent 2px 6px),linear-gradient(180deg,#e2dccd 0%,#b3ab9a 34%,#7d766a 56%,#5f594e 70%,#6d7a4a 88%,#4f5a34 100%);-webkit-text-stroke:2.5px #1e1b16;filter:drop-shadow(0 3px 0 #3a352c) drop-shadow(0 7px 0 #24201a) drop-shadow(0 12px 12px rgba(0,0,0,.7))}
.vC .sweep{background-image:radial-gradient(circle at 50% 60%,rgba(255,150,50,.95),rgba(255,90,20,.4) 18%,transparent 34%);background-size:220% 160%;animation:runeHeat 4.2s ease-in-out infinite;mix-blend-mode:screen}
@keyframes runeHeat{0%{background-position:120% 50%;opacity:.4}50%{background-position:50% 50%;opacity:1}100%{background-position:-20% 50%;opacity:.4}}
.vC .rays{background:repeating-conic-gradient(from 0deg,rgba(255,150,60,.3) 0deg 4deg,transparent 4deg 22deg)}
.vC .glow{background:radial-gradient(circle,rgba(255,140,50,.5),rgba(120,60,20,.2) 50%,transparent 70%);animation-duration:3.6s}
.vC .clk{filter:sepia(.7) saturate(.8) brightness(.85) drop-shadow(0 0 14px rgba(255,130,40,.7))}
.runeRing{position:absolute;inset:-9%;animation:spin 40s linear infinite reverse;pointer-events:none}
.runeTxt{font-family:serif;font-size:15px;fill:#ffb35a;letter-spacing:6px;animation:runeG 2.4s ease-in-out infinite}
@keyframes runeG{0%,100%{opacity:.55}50%{opacity:1}}
.runeRing svg{filter:drop-shadow(0 0 6px rgba(255,140,40,.9))}
.crack{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none}
.crack path{stroke:#ff9a3a;stroke-width:2;fill:none;filter:drop-shadow(0 0 4px #ff7a1a);stroke-dasharray:60;animation:crack 3s ease-in-out infinite}
@keyframes crack{0%,100%{stroke-dashoffset:60;opacity:.2}50%{stroke-dashoffset:0;opacity:1}}
.stoneTag{height:32px;padding:0 18px;display:flex;align-items:center;border-radius:6px;background:linear-gradient(180deg,#8d8676,#5d574c);border:2px solid #2a2620;color:#f1e9d6;font-weight:900;font-size:13px;letter-spacing:4px;text-shadow:0 -1px 0 #2a2620,0 1px 0 rgba(255,255,255,.2);box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 5px 0 #2a2620,0 8px 12px rgba(0,0,0,.6)}
.emb{background:#ffb347;box-shadow:0 0 8px 2px rgba(255,140,40,.8)}
/* HUD do título */
.ib{width:44px;height:44px;border-radius:14px;border:2px solid #4a3a2b;background:rgba(22,17,13,.78);display:flex;align-items:center;justify-content:center;padding:0;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.ib:active{transform:scale(.92)}
.gear{animation:spin 8s linear infinite}
.eq{display:flex;gap:2px;align-items:flex-end;height:16px}
.eq i{width:3px;background:#ffc94a;border-radius:1px;animation:eqA .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eqA{0%,100%{height:4px}50%{height:16px}}
/* botões de baixo (na estrada, abaixo dos pés) */
.bottom{position:absolute;left:16px;right:16px;bottom:max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px;z-index:8}
.play{display:flex;align-items:center;justify-content:center;width:min(270px,100%);height:clamp(58px,8vh,68px);border-radius:20px;background:linear-gradient(180deg,#ffe07a 0%,#f2a826 100%);color:#2a1403;font-family:'Lilita One',sans-serif;font-size:clamp(30px,4.4vh,36px);letter-spacing:3px;text-decoration:none;position:relative;overflow:hidden;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 6px 0 #8a4f0c,0 0 22px rgba(255,184,74,.45)}50%{transform:scale(1.06);box-shadow:0 6px 0 #8a4f0c,0 0 46px rgba(255,184,74,.95)}}
.play::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.6) 50%,transparent 60%);background-size:300% 100%;animation:sweep 2.6s ease-in-out infinite}
.play:active{transform:translateY(4px) scale(.98)}
.cont{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 14px 0 6px;border-radius:24px;border:2px solid #4a3a2b;background:rgba(22,17,13,.85);color:#f6ecdf;font-weight:900;font-size:14px;text-decoration:none}
.cont:active{transform:scale(.97)}
.miniAv{position:relative;width:36px;height:36px;border-radius:50%;overflow:hidden;border:2px solid #ffc94a;background:#1d1611;flex:none}
.miniAv .kIdle{position:absolute;left:-14px;top:-4px;width:62px;height:62px}
.flashOut{position:absolute;inset:0;z-index:50;background:#fff;pointer-events:none;animation:fo .5s ease-out both}
@keyframes fo{from{opacity:.95}to{opacity:0}}
.vIn{animation:fade .4s ease-out both}
@media (max-height:700px){.tag{display:none}}
@media (max-height:620px){.cont{min-height:44px}.kael{--ks:140px}}
</style>
</helmet>
<div class="app">

  <!-- ===== faixa do PROTÓTIPO: escolha do logo + Kael ===== -->
  <div class="strip" role="group" aria-label="Protótipo: variações do logo">
    <sc-for list="{{vars}}" as="v" hint-placeholder-count="3">
      <button class="vb" onClick="{{v.pick}}" aria-pressed="{{v.on}}" aria-label="{{v.aria}}"><b>{{v.k}}</b>{{v.n}}</button>
    </sc-for>
    <button class="vb" onClick="{{toggleRun}}" aria-pressed="{{runPressed}}" aria-label="Protótipo: Kael correndo ou parado"><b>Kael</b>{{runTxt}}</button>
  </div>

  <div class="game">
    <!-- cenário vivo -->
    <div class="{{sceneCls}}">
      <div class="ly Lsky"></div>
      <div class="ly Lcld"></div>
      <div class="ly Lfar"></div>
      <div class="ly Lmid"></div>
      <div class="ly Lgnd"></div>
    </div>

    <!-- luz/clima de cada variação -->
    <sc-if value="{{isA}}" hint-placeholder-val="{{true}}">
      <div class="tint vIn" style="background: linear-gradient(180deg, rgba(255,140,50,0.5) 0%, rgba(255,190,110,0.18) 38%, rgba(10,7,5,0) 58%, rgba(10,7,5,0.35) 78%, rgba(10,7,5,0.88) 100%)"></div>
      <span class="beam" style="left: 18%"></span>
      <span class="beam" style="left: 62%; animation-delay: -3s; width: 60px"></span>
    </sc-if>
    <sc-if value="{{isB}}" hint-placeholder-val="{{false}}">
      <div class="tint vIn" style="background: linear-gradient(180deg, rgba(6,14,48,0.9) 0%, rgba(14,30,90,0.55) 40%, rgba(10,20,60,0.25) 62%, rgba(4,8,20,0.9) 100%)"></div>
      <span class="star" style="left: 8%; top: 6%"></span><span class="star" style="left: 22%; top: 14%; animation-delay: .5s"></span>
      <span class="star" style="left: 40%; top: 4%; animation-delay: 1.1s"></span><span class="star" style="left: 70%; top: 10%; animation-delay: .3s"></span>
      <span class="star" style="left: 86%; top: 18%; animation-delay: 1.6s"></span><span class="star" style="left: 94%; top: 5%; animation-delay: .9s"></span>
      <span class="star" style="left: 14%; top: 30%; animation-delay: 1.3s"></span><span class="star" style="left: 80%; top: 34%; animation-delay: .7s"></span>
    </sc-if>
    <sc-if value="{{isC}}" hint-placeholder-val="{{false}}">
      <div class="tint vIn" style="background: linear-gradient(180deg, rgba(30,36,30,0.75) 0%, rgba(60,70,55,0.35) 40%, rgba(20,24,20,0.15) 62%, rgba(8,8,6,0.9) 100%)"></div>
      <span class="fog" style="top: 46%; width: 220px; animation-duration: 30s"></span>
      <span class="fog" style="top: 58%; width: 280px; animation-duration: 38s; animation-delay: -14s"></span>
      <span class="fog" style="top: 36%; width: 180px; animation-duration: 26s; animation-delay: -8s"></span>
    </sc-if>

    <!-- partículas subindo -->
    <span class="{{riseCls}}" style="left: 8%; width: 5px; height: 5px; animation-duration: 8s"></span>
    <span class="{{riseCls}}" style="left: 24%; width: 4px; height: 4px; animation-duration: 10s; animation-delay: 2s"></span>
    <span class="{{riseCls}}" style="left: 41%; width: 6px; height: 6px; animation-duration: 7s; animation-delay: 4s"></span>
    <span class="{{riseCls}}" style="left: 58%; width: 4px; height: 4px; animation-duration: 9s; animation-delay: 1s"></span>
    <span class="{{riseCls}}" style="left: 74%; width: 5px; height: 5px; animation-duration: 8.5s; animation-delay: 3s"></span>
    <span class="{{riseCls}}" style="left: 90%; width: 3px; height: 3px; animation-duration: 7.5s; animation-delay: 5s"></span>

    <!-- Kael na estrada -->
    <div class="kShadow"></div>
    <sc-if value="{{running}}" hint-placeholder-val="{{true}}">
      <span class="dust" style="left: calc(50% - 30px)"></span>
      <span class="dust" style="left: calc(50% - 20px); animation-delay: .33s"></span>
      <div class="kael kRun" role="img" aria-label="Kael correndo pela estrada"></div>
    </sc-if>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
/* Título V2: 3 variações de logo (A/B/C) trocadas pela faixa PROTÓTIPO. A letra de cada variação entra caindo, uma a uma. */
var SND = { tap: '/_blob/e3753a41131f84e23546318c17022b13', portal: '/_blob/af2eace71811af794b916b2e691a9489', swap: '/_blob/07a146ee324bece467fc05bedf4435b0', music: '/_blob/c145b95db4c077b8db75bdb8329e5fe7' };
var VARS = [
  { id: 'A', n: 'Dourado', full: 'A dourado clássico' },
  { id: 'B', n: 'Cristal', full: 'B cristal azul futurista' },
  { id: 'C', n: 'Rúnico', full: 'C pedra rúnica antiga' }
];
var RISE = { A: 'rise emb', B: 'rise', C: 'rise emb' };

class Component extends DCLogic {
  constructor(p) { super(p); this.tm = []; this.state = { v: 'C', run: true, music: false, flash: false }; }
  sfx(u, v) { try { var a = new Audio(u); a.volume = v || 0.7; a.play().catch(function () {}); } catch (e) {} }
  componentWillUnmount() { this.tm.forEach(clearTimeout); if (this.m) this.m.pause(); }
  renderVals() {
    var s = this.state, self = this;
    var letters = 'EONBOUND'.split('').map(function (c, i) { return { c: c, d: (0.15 + i * 0.07) + 's' }; });
    var cur = VARS.filter(function (x) { return x.id === s.v; })[0];
    return {
      vars: VARS.map(function (x) {
        return { k: x.id, n: x.n, on: x.id === s.v ? 'true' : 'false', aria: 'Protótipo: ver logo ' + x.full,
          pick: function () { if (x.id === s.v) return; self.sfx(SND.swap, 0.6); self.setState({ v: x.id }); } };
      }),
      vName: cur.full,
      isA: s.v === 'A', isB: s.v === 'B', isC: s.v === 'C',
      letters: letters,
      riseCls: RISE[s.v],
      running: s.run, standing: !s.run,
      runPressed: s.run ? 'true' : 'false',
      runTxt: s.run ? 'correndo' : 'parado',
      sceneCls: 'scene' + (s.run ? ' run' : ''),
      toggleRun: function () { self.sfx(SND.tap); self.setState({ run: !s.run }); },
      musicOn: s.music, musicOff: !s.music,
      soundPressed: s.music ? 'true' : 'false',
      soundAria: s.music ? 'Desligar música' : 'Ligar música',
      soundBd: s.music ? '#ffc94a' : '#4a3a2b',
      toggleMusic: function () {
        if (!self.m) { self.m = new Audio(SND.music); self.m.loop = true; self.m.volume = 0.55; }
        if (s.music) self.m.pause(); else self.m.play().catch(function () {});
        self.setState({ music: !s.music });
      },
      tap: function () { self.sfx(SND.tap); },
      flashOn: s.flash,
      play: function () {
        self.sfx(SND.portal, 0.8);
        self.setState({ flash: true });
        self.tm.push(setTimeout(function () { self.setState({ flash: false }); }, 500));
      }
    };
  }
}
</script>
